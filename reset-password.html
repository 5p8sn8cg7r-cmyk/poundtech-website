<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password | PoundTech</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="/favicon.ico?v=10" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=10">
<style>
.reset-wrap{max-width:480px;margin:42px auto;padding:0 18px}
.reset-card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 3px 18px #00000012}
.reset-card h1{margin-top:0}
.reset-card label{display:block;font-weight:600;margin:16px 0 7px}
.reset-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:7px;font-size:16px}
.reset-card button{width:100%;margin-top:18px}
#reset-message{line-height:1.55;overflow-wrap:anywhere}
.reset-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.reset-links a{color:#c62828;font-weight:700}
</style>
<link rel="stylesheet" href="/back-button.css?v=20261111">
</head>
<body>
<header class="site-header">
  <a class="logo" href="/index.html">POUND<span>TECH</span></a>
  <a class="back pt-back-marketplace" href="/index.html">&larr; Back to marketplace</a>
</header>

<main class="reset-wrap">
  <section class="reset-card">
    <h1>Set a new password</h1>
    <p>Choose a new password for your PoundTech account.</p>
    <div id="reset-state" aria-live="polite">
      <form id="reset-form" hidden>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again">
        <button class="btn" id="save-password" type="submit">Update password</button>
      </form>
    </div>
    <p id="reset-message" role="status">Checking your password reset link…</p>
    <div class="reset-links" id="reset-links" hidden>
      <a href="customer-login.html">Customer login</a>
      <a href="supplier-login.html">Supplier login</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("reset-form");
const message = document.getElementById("reset-message");
const saveButton = document.getElementById("save-password");
const links = document.getElementById("reset-links");
let recoveryReady = false;

function showMessage(text, isError = false) {
  message.textContent = text;
  message.style.color = isError ? "#c62828" : "#16783a";
}

function showResetForm() {
  recoveryReady = true;
  form.hidden = false;
  showMessage("Your reset link is valid. Enter and confirm your new password.");
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    showResetForm();
  }
});

(async function initialiseRecovery() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    showMessage("We couldn't verify this reset link. Please request a new one from the login page.", true);
    links.hidden = false;
    return;
  }

  if (data.session) {
    showResetForm();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.has("error") || params.has("error_description")) {
    showMessage("This password reset link is invalid or has expired. Please request a new one from the login page.", true);
  } else {
    showMessage("This reset link may have expired or already been used. Please request a fresh one from the login page.", true);
  }
  links.hidden = false;
})();

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!recoveryReady) {
    showMessage("Please open the password reset link from your email again.", true);
    return;
  }

  const password = document.getElementById("new-password").value;
  const confirmation = document.getElementById("confirm-password").value;

  if (password.length < 8) {
    showMessage("Your password must be at least 8 characters long.", true);
    return;
  }

  if (password !== confirmation) {
    showMessage("The passwords do not match. Please try again.", true);
    return;
  }

  saveButton.disabled = true;
  showMessage("Updating your password…");

  const { error } = await supabaseClient.auth.updateUser({ password });

  saveButton.disabled = false;

  if (error) {
    console.error(error);
    showMessage("We couldn't update your password. Your reset link may have expired. Please request a new one and try again.", true);
    return;
  }

  form.hidden = true;
  showMessage("Your password has been updated successfully. You can now log in with your new password.");
  links.hidden = false;
});
</script>
<script src="nav.js"></script>
</body>
</html>
