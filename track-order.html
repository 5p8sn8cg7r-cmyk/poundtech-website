<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order | PoundTech</title>
</head>

<body style="
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f5f7;
">

<header style="
    background:#111;
    color:white;
    padding:20px;
">

    <h1 style="margin:0;">
        POUND<span style="color:red;">TECH</span>
    </h1>

</header>

<main style="
    max-width:600px;
    margin:50px auto;
    padding:20px;
">

    <div style="
        background:white;
        padding:30px;
        border-radius:10px;
        border:1px solid #ddd;
    ">

        <h2>Track Your Order</h2>

        <p style="color:#666;">
            Enter your order number and email address to check your order status.
        </p>

        <label>Order Number</label>

        <input
            id="order-number"
            type="text"
            placeholder="e.g. PT123456789"
            style="
                width:100%;
                padding:12px;
                margin:8px 0 20px;
                box-sizing:border-box;
            "
        >

        <label>Email Address</label>

        <input
            id="order-email"
            type="email"
            placeholder="Your email address"
            style="
                width:100%;
                padding:12px;
                margin:8px 0 20px;
                box-sizing:border-box;
            "
        >

        <button
            onclick="trackOrder()"
            style="
                width:100%;
                padding:14px;
                background:#e00000;
                color:white;
                border:none;
                border-radius:6px;
                font-weight:bold;
                cursor:pointer;
            "
        >
            Track Order
        </button>

        <div id="order-result" style="margin-top:25px;"></div>

    </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function trackOrder() {

    const orderNumber =
        document.getElementById("order-number").value.trim();

    const email =
        document.getElementById("order-email").value.trim();

    const result =
        document.getElementById("order-result");

    if (!orderNumber || !email) {
        result.innerHTML =
            "<p style='color:#e00000;'>Please enter your order number and email address.</p>";
        return;
    }

    result.innerHTML =
        "<p>Looking up your order...</p>";

    const { data, error } =
        await supabaseClient.rpc(
            "track_poundtech_order",
            {
                lookup_order_number: orderNumber,
                lookup_email: email
            }
        );

    if (error) {
        console.error(error);

        result.innerHTML =
            "<p style='color:#e00000;'>Unable to track this order.</p>";

        return;
    }

    if (!data || data.length === 0) {

        result.innerHTML = `
            <div style="
                background:#fff3f3;
                padding:15px;
                border-radius:8px;
            ">
                <strong>Order not found.</strong>
                <p>
                    Check your order number and email address.
                </p>
            </div>
        `;

        return;
    }

    const order = data[0];

    result.innerHTML = `
        <div style="
            background:#f5f5f5;
            padding:20px;
            border-radius:8px;
        ">

            <h3 style="margin-top:0;">
                Order ${order.order_number}
            </h3>

            <p>
                <strong>Status:</strong>
                ${order.status}
            </p>

            <p>
                <strong>Total:</strong>
                R${order.total}
            </p>

            <p style="color:#777;">
                ${new Date(order.created_at).toLocaleString()}
            </p>

        </div>
    `;
}

</script>
    
</body>
</html>
