<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | PoundTech</title>
<link rel="stylesheet" href="site.css">

<style>

.page-main { max-width: 920px; margin-top: 28px; }

.card { margin-bottom: 22px; }

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.top-bar .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.btn-small {
    width: auto;
    padding: 9px 16px;
    font-size: 14px;
}

.btn-outline {
    background: white;
    color: #111;
    border: 1px solid #ccc;
}

.btn-outline:hover { background: #f4f5f7; }

.section-title {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin: 26px 0 12px;
}

.section-title:first-of-type { margin-top: 6px; }

.item {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
}

.item.needs-action {
    border-left: 4px solid #e00000;
    background: #fffafa;
}

.item-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.item-head h3 { font-size: 17px; }

.pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #eee;
    color: #444;
    white-space: nowrap;
}

.pill-ok   { background: #e6f4ea; color: #16803c; }
.pill-warn { background: #fff4e0; color: #8a5a00; }
.pill-bad  { background: #fdecec; color: #8a1111; }

.details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 4px 20px;
    font-size: 14px;
    color: #333;
    margin-bottom: 4px;
}

.details strong { color: #666; font-weight: bold; }

.when {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 14px;
}

.actions select {
    width: auto;
    margin: 0;
    padding: 9px 12px;
    font-size: 14px;
}

.actions .btn { width: auto; }

.empty { color: #666; padding: 4px 0 10px; }

.quote-form { margin-top: 14px; }

.quote-form textarea { min-height: 80px; }

#message { position: sticky; top: 10px; z-index: 5; }

[hidden] { display: none !important; }

.od-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.od-cards button.od-card{display:block;width:100%;margin:0;text-align:left;background:#fff;color:#111;border:1px solid #e3e3e3;border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:normal;transition:border-color .15s,box-shadow .15s}
.od-cards button.od-card:hover{background:#fff;border-color:#111;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.od-card .n{display:block;font-size:28px;font-weight:700;line-height:1.1}
.od-card .l{display:block;margin-top:4px;font-size:13px;color:#666}
.od-card.hot{border-color:#e00000}
.od-card.hot .n{color:#e00000}
.od-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.od-tabs button.od-tab{flex:0 0 auto;margin:0;background:#fff;color:#111;border:1px solid #d8d8d8;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.od-tabs button.od-tab:hover{background:#f1f1f1}
.od-tabs button.od-tab.on{background:#111;color:#fff;border-color:#111}
.od-tab .c{display:inline-block;min-width:20px;margin-left:6px;padding:1px 7px;border-radius:999px;background:#eee;color:#111;font-size:12px}
.od-tab.on .c{background:#fff;color:#111}
.od-tab .c.hot{background:#e00000;color:#fff}
.od-search{font-family:inherit;width:100%;padding:12px 14px;margin:0 0 14px;box-sizing:border-box;border:1px solid #d8d8d8;border-radius:10px;font-size:15px;background:#fff}
.od-empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:30px;text-align:center;color:#666}
.od-item{background:#fff;border:1px solid #e3e3e3;border-radius:12px;margin-bottom:10px;overflow:hidden}
.od-item.late{border-left:4px solid #e00000}
.od-item summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.od-item summary::-webkit-details-marker{display:none}
.od-item .no{font-weight:700;font-size:16px}
.od-item .meta{color:#777;font-size:13px}
.od-item .sp{flex:1 1 auto}
.od-item .tot{font-weight:700}
.od-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eee;color:#111}
.od-pill.red{background:#e00000;color:#fff}
.od-pill.green{background:#d4edda;color:#145c2a}
.od-pill.amber{background:#fff3cd;color:#7a5a00}
.od-pill.dark{background:#111;color:#fff}
.od-body{padding:0 16px 16px;border-top:1px solid #eee}
.od-body h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#666}
.od-body p{margin:4px 0}
.od-line{padding:10px;background:#f5f5f5;border-radius:8px;margin-bottom:6px;font-size:14px}
.od-actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.od-actions select{padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.od-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999}
@media(max-width:640px){.od-cards{grid-template-columns:repeat(2,1fr)}}

.dash-nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding:6px;background:#fff;border:1px solid #e3e3e3;border-radius:12px}
.dash-nav a{padding:10px 16px;border-radius:8px;color:#111;text-decoration:none;font-size:14px;font-weight:600}
.dash-nav a:hover{background:#f1f1f1}
.dash-nav a.on{background:#111;color:#fff}
.od-cards button,.od-tabs button{font-family:inherit}
</style>
</head>

<body>

<header class="site-header">
    <a class="logo" href="/">POUND<span>TECH</span></a>
    <a class="back" href="/">&larr; Back to marketplace</a>
</header>

<section class="page-hero">
    <h1 id="hero-title">Dashboard</h1>
    <p id="hero-sub">Loading your account…</p>
</section>

<main class="page-main">

    <nav class="dash-nav" aria-label="Dashboard sections">
        <a href="mechanic-dashboard.html" class="on">Bookings &amp; quotes</a>
        <a href="business-dashboard.html#services">Services &amp; prices</a>
        <a href="business-dashboard.html#hours">Opening hours</a>
        <a href="business-dashboard.html#booking-settings">Booking settings</a>
    </nav>

    <div class="top-bar">
        <p id="today-line" style="margin:0;color:#666;"></p>
        <button class="btn btn-small btn-outline" id="logout-btn">Log out</button>
    </div>

    <div id="message" role="status"></div>

    <div class="od-cards" id="md-cards"></div>
    <div class="od-tabs" id="md-tabs"></div>
    <input class="od-search" id="md-search" type="search"
           placeholder="Search by customer, vehicle, service or phone"
           oninput="MD_QUERY=this.value; renderMechanicLists();">

    <div id="bookings-container"><p class="empty">Loading bookings…</p></div>
    <div id="quote-requests" hidden><p class="empty">Loading quote requests…</p></div>

</main>

<footer class="site-footer">
    <nav>
        <a href="terms.html">Terms &amp; Conditions</a>
        <a href="refunds.html">Refund &amp; Returns</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="delivery.html">Delivery Policy</a>
    </nav>
    <p>&copy; 2026 PoundTech. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


let currentMechanic = null;
let messageTimer = null;


/* ---------- helpers ---------- */

// Everything that comes from a customer is escaped before it goes on the page.
function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function $(id) {
    return document.getElementById(id);
}

function notify(text, type) {

    const box = $("message");

    clearTimeout(messageTimer);

    if (!text) {
        box.className = "";
        box.textContent = "";
        return;
    }

    box.className = "message message-" + (type || "info");
    box.textContent = text;

    messageTimer = setTimeout(() => notify(""), 5000);
}

function money(value) {
    return "R" + Number(value).toLocaleString("en-ZA", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function pillClass(status) {
    if (["Scheduled", "Accepted", "In Progress", "Completed", "Quoted"].includes(status)) {
        return "pill pill-ok";
    }
    if (["Pending", "Pending Approval"].includes(status)) {
        return "pill pill-warn";
    }
    if (["Declined", "Cancelled"].includes(status)) {
        return "pill pill-bad";
    }
    return "pill";
}

function formatWhen(booking) {

    if (booking.start_time) {
        return new Date(booking.start_time).toLocaleString("en-ZA", {
            timeZone: "Africa/Johannesburg",
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });
    }

    if (booking.booking_date) {
        return new Date(booking.booking_date + "T00:00:00").toLocaleDateString("en-ZA", {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    return "Date not selected";
}

function whenValue(booking) {

    if (booking.start_time) {
        return new Date(booking.start_time).getTime();
    }

    if (booking.booking_date) {
        return new Date(booking.booking_date + "T23:59:59").getTime();
    }

    return null;
}


/* ---------- start up ---------- */

async function loadMechanic() {

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    // Not logged in
    if (userError || !user) {
        window.location.href = "mechanic-login.html";
        return;
    }

    const { data: mechanic, error } = await supabaseClient
        .from("mechanics")
        .select("*")
        .eq("user_id", user.id)
        .eq("status", "Approved")
        .maybeSingle();

    // Logged in, but not an approved business
    if (error || !mechanic) {
        alert("You do not have an approved business account.");
        await supabaseClient.auth.signOut();
        window.location.href = "mechanic-login.html";
        return;
    }

    currentMechanic = mechanic;

    $("hero-title").textContent = mechanic.business_name;
    $("hero-sub").textContent = "Your bookings and quote requests in one place.";

    loadBookings();
    loadQuoteRequests();
}


/* ---------- bookings ---------- */

function bookingCard(booking) {

    const needsApproval = booking.status === "Pending Approval";
    const closed = ["Declined", "Cancelled"].includes(booking.status);

    let actions = "";

    if (needsApproval) {
        actions = `
            <div class="actions">
                <button class="btn btn-small" data-action="approve" data-id="${esc(booking.id)}">Approve</button>
                <button class="btn btn-small btn-outline" data-action="decline" data-id="${esc(booking.id)}">Decline</button>
            </div>`;
    } else if (!closed) {
        const options = ["Accepted", "Scheduled", "In Progress", "Completed", "Cancelled"]
            .map(s => `<option value="${esc(s)}" ${booking.status === s ? "selected" : ""}>${esc(s)}</option>`)
            .join("");

        actions = `
            <div class="actions">
                <label style="margin:0;font-weight:normal;font-size:14px;">Update status</label>
                <select data-action="status" data-id="${esc(booking.id)}">${options}</select>
            </div>`;
    }

    return `
        <div class="item ${needsApproval ? "needs-action" : ""}">

            <div class="item-head">
                <h3>${esc(booking.customer_name)}</h3>
                <span>
                    <span class="${pillClass(booking.status)}">${esc(booking.status)}</span>
                    ${booking.payment_status === "Paid" ? '<span class="pill pill-ok">Paid</span>' : ""}
                </span>
            </div>

            <div class="when">${esc(formatWhen(booking))}</div>

            <div class="details">
                <div><strong>Service:</strong> ${esc(booking.service_required)}</div>
                <div><strong>Price:</strong> ${esc(money(booking.agreed_price))}</div>
                <div><strong>Vehicle:</strong> ${esc(booking.vehicle)}</div>
                <div><strong>Phone:</strong> ${esc(booking.customer_phone)}</div>
                <div><strong>Email:</strong> ${esc(booking.customer_email)}</div>
                ${booking.notes ? `<div><strong>Notes:</strong> ${esc(booking.notes)}</div>` : ""}
            </div>

            ${actions}

        </div>`;
}

async function loadBookings() {

    const container = $("bookings-container");

    const { data: bookings, error } = await supabaseClient
        .from("mechanic_bookings")
        .select("*")
        .eq("mechanic_id", currentMechanic.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        container.innerHTML = '<p class="empty">We couldn\'t load your bookings. Please refresh the page.</p>';
        return;
    }

    MD_BOOKINGS = bookings || [];
    renderMechanicDashboard();
}

var MD_BOOKINGS = [];
var MD_QUOTES = [];
var MD_TAB = "attention";
var MD_QUERY = "";

function dayKey(d) {
    return new Date(d).toLocaleDateString("en-CA", { timeZone: "Africa/Johannesburg" });
}

function bookingDay(b) {
    if (b.start_time) { return dayKey(b.start_time); }
    if (b.booking_date) { return String(b.booking_date).slice(0, 10); }
    return null;
}

var ACTIVE_STATUSES = ["Accepted", "Scheduled", "In Progress"];

// Which tab a booking belongs to.
function bookingGroup(b) {

    const today = dayKey(Date.now());
    const day = bookingDay(b);

    if (b.status === "Pending Approval") { return "attention"; }

    if (ACTIVE_STATUSES.includes(b.status)) {
        if (day && day < today) { return "attention"; }   // job date passed, status never updated
        if (day === today) { return "today"; }
        return "upcoming";
    }

    return "past";
}

function mdTabsDef() {
    return [
        { id: "attention", label: "Needs attention" },
        { id: "today",     label: "Today" },
        { id: "upcoming",  label: "Upcoming" },
        { id: "past",      label: "Completed & past" },
        { id: "quotes",    label: "Quote requests" }
    ];
}

function mdCount(id) {
    if (id === "quotes") { return MD_QUOTES.filter(q => q.status === "Pending").length; }
    return MD_BOOKINGS.filter(b => bookingGroup(b) === id).length;
}

function setMechanicTab(id) {
    MD_TAB = id;
    renderMechanicDashboard();
}

function renderMechanicDashboard() {

    const cards = [
        { id: "attention", label: "Need your attention", hot: mdCount("attention") > 0 },
        { id: "today",     label: "Jobs today",          hot: false },
        { id: "upcoming",  label: "Upcoming",            hot: false },
        { id: "quotes",    label: "Quotes to answer",    hot: mdCount("quotes") > 0 }
    ];

    $("md-cards").innerHTML = cards.map(c =>
        `<button type="button" class="od-card ${c.hot ? "hot" : ""}" onclick="setMechanicTab('${c.id}')">
            <span class="n">${mdCount(c.id)}</span><span class="l">${c.label}</span>
        </button>`).join("");

    $("md-tabs").innerHTML = mdTabsDef().map(t => {
        const n = mdCount(t.id);
        const hot = (t.id === "attention" || t.id === "quotes") && n > 0;
        return `<button type="button" class="od-tab ${MD_TAB === t.id ? "on" : ""}" onclick="setMechanicTab('${t.id}')">
                    ${t.label}<span class="c ${hot ? "hot" : ""}">${n}</span>
                </button>`;
    }).join("");

    $("today-line").textContent = new Date().toLocaleDateString("en-ZA", {
        timeZone: "Africa/Johannesburg", weekday: "long", day: "numeric", month: "long"
    });

    renderMechanicLists();
}

function mdMatches(text) {
    const q = MD_QUERY.trim().toLowerCase();
    return !q || text.toLowerCase().indexOf(q) !== -1;
}

function renderMechanicLists() {

    const showQuotes = (MD_TAB === "quotes");

    $("bookings-container").hidden = showQuotes;
    $("quote-requests").hidden = !showQuotes;

    if (showQuotes) {
        renderQuoteList();
        return;
    }

    const rows = MD_BOOKINGS.filter(b =>
        bookingGroup(b) === MD_TAB &&
        mdMatches([b.customer_name, b.vehicle, b.service_required, b.customer_phone, b.customer_email].join(" "))
    );

    // Work still to do: soonest first. Finished work: most recent first.
    const soonestFirst = (MD_TAB !== "past");

    rows.sort((a, b) => {
        const av = whenValue(a) || new Date(a.created_at).getTime();
        const bv = whenValue(b) || new Date(b.created_at).getTime();
        return soonestFirst ? av - bv : bv - av;
    });

    const container = $("bookings-container");

    if (rows.length === 0) {
        container.innerHTML = `<div class="od-empty">${MD_QUERY.trim() ? "No bookings match your search." : "Nothing here right now."}</div>`;
        return;
    }

    container.innerHTML = rows.map(bookingCard).join("");
}


async function setBookingStatus(bookingId, newStatus) {

    const { error } = await supabaseClient
        .from("mechanic_bookings")
        .update({
            status: newStatus,
            cancelled_at: newStatus === "Cancelled" ? new Date().toISOString() : null
        })
        .eq("id", bookingId)
        .eq("mechanic_id", currentMechanic.id);

    if (error) {
        console.error(error);
        notify("We couldn't update that booking: " + error.message, "error");
        loadBookings();
        return;
    }

    notify("Booking updated.", "success");
    loadBookings();
}


/* ---------- quote requests ---------- */

async function loadQuoteRequests() {

    const container = $("quote-requests");

    const { data: requests, error } = await supabaseClient
        .from("mechanic_quote_requests")
        .select("*")
        .eq("mechanic_id", currentMechanic.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        container.innerHTML = '<p class="empty">We couldn\'t load your quote requests. Please refresh the page.</p>';
        return;
    }

    MD_QUOTES = requests || [];
    renderMechanicDashboard();
}

function renderQuoteList() {

    const container = $("quote-requests");

    const order = { "Pending": 0, "Quoted": 1, "Accepted": 2, "Declined": 3 };

    const requests = MD_QUOTES.filter(q =>
        mdMatches([q.customer_name, q.vehicle, q.service_required, q.customer_phone, q.customer_email].join(" "))
    ).sort((a, b) =>
        (order[a.status] ?? 9) - (order[b.status] ?? 9) ||
        new Date(a.created_at) - new Date(b.created_at)
    );

    if (requests.length === 0) {
        container.innerHTML = `<div class="od-empty">${MD_QUERY.trim() ? "No quote requests match your search." : "No quote requests yet."}</div>`;
        return;
    }

    container.innerHTML = requests.map(request => {

        const id = esc(request.id);

        const statusOptions = ["Pending", "Quoted", "Accepted", "Declined"]
            .map(s => `<option value="${s}" ${request.status === s ? "selected" : ""}>${s}</option>`)
            .join("");

        return `
            <div class="item ${request.status === 'Pending' ? 'needs-action' : ''}">

                <div class="item-head">
                    <h3>${esc(request.customer_name)}</h3>
                    <span class="${pillClass(request.status)}">${esc(request.status)}</span>
                </div>

                <div class="details">
                    <div><strong>Phone:</strong> ${esc(request.customer_phone)}</div>
                    <div><strong>Email:</strong> ${esc(request.customer_email)}</div>
                    <div><strong>Vehicle:</strong> ${esc(request.vehicle)}</div>
                    <div><strong>Service:</strong> ${esc(request.service_required)}</div>
                    <div><strong>Preferred date:</strong> ${esc(request.preferred_date || "Not specified")}</div>
                </div>

                <p style="margin-top:10px;font-size:14px;">
                    <strong style="color:#666;">Problem:</strong>
                    ${esc(request.problem_description || "Not provided")}
                </p>

                <div class="quote-form">

                    <label for="response-${id}">Your response</label>
                    <textarea id="response-${id}"
                        placeholder="Enter your response to the customer…">${esc(request.mechanic_response || "")}</textarea>

                    <label for="price-${id}">Quoted price (R)</label>
                    <input type="number" id="price-${id}" min="0" step="0.01"
                        value="${esc(request.quoted_price || "")}" placeholder="Enter price">

                    <label for="status-${id}">Status</label>
                    <select id="status-${id}">${statusOptions}</select>

                    <button class="btn btn-small" data-action="send-quote" data-id="${id}">Send quote</button>

                </div>

            </div>`;
    }).join("");
}

async function updateQuote(requestId) {

    const response = $("response-" + requestId).value;
    const priceText = $("price-" + requestId).value;
    const status = $("status-" + requestId).value;

    const price = priceText === "" ? null : Number(priceText);

    if (price !== null && (!isFinite(price) || price < 0)) {
        notify("Please enter a valid price.", "error");
        return;
    }

    const { error } = await supabaseClient
        .from("mechanic_quote_requests")
        .update({
            mechanic_response: response,
            quoted_price: price,
            status: status
        })
        .eq("id", requestId)
        .eq("mechanic_id", currentMechanic.id);

    if (error) {
        console.error(error);
        notify("We couldn't update that quote: " + error.message, "error");
        return;
    }

    notify("Quote updated.", "success");
    loadQuoteRequests();
}


/* ---------- wiring ---------- */

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "mechanic-login.html";
}

$("logout-btn").addEventListener("click", logout);

$("bookings-container").addEventListener("click", e => {

    const button = e.target.closest("button[data-action]");

    if (!button) { return; }

    const id = button.dataset.id;

    if (button.dataset.action === "approve") {
        setBookingStatus(id, "Scheduled");
    } else if (button.dataset.action === "decline") {
        if (confirm("Decline this booking request? The time slot will be freed up.")) {
            setBookingStatus(id, "Declined");
        }
    }
});

$("bookings-container").addEventListener("change", e => {

    const select = e.target.closest("select[data-action='status']");

    if (!select) { return; }

    if (select.value === "Cancelled" &&
        !confirm("Cancel this booking? The time slot will be freed up.")) {
        loadBookings();
        return;
    }

    setBookingStatus(select.dataset.id, select.value);
});

$("quote-requests").addEventListener("click", e => {

    const button = e.target.closest("button[data-action='send-quote']");

    if (button) {
        updateQuote(button.dataset.id);
    }
});

loadMechanic();

</script>

</body>
</html>
