<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Dashboard - PoundTech</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .quote {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .quote h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea,
        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .logout {
            background: #c00;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #eee;
            font-size: 13px;
        }

        #message {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>PoundTech Mechanic Dashboard</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Welcome</h2>
        <p id="mechanic-name">Loading...</p>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>
    </div>

    <div class="card">

        <h2>Quote Requests</h2>

        <div id="message"></div>

        <div id="quote-requests">
            Loading quote requests...
        </div>
        
<hr style="margin:40px 0;">

<h2>Bookings</h2>

<div id="bookings-container">
    <p>Loading bookings...</p>
</div>
        
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentMechanic = null;


// Load logged-in mechanic
async function loadMechanic() {

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    // Not logged in
    if (userError || !user) {

        window.location.href =
            "mechanic-login.html";

        return;
    }


    const {
        data: mechanic,
        error
    } = await supabaseClient
        .from("mechanics")
        .select("*")
        .eq("user_id", user.id)
        .eq("status", "Approved")
        .maybeSingle();


    // Logged in, but not an approved mechanic
    if (error || !mechanic) {

        alert(
            "You do not have an approved mechanic account."
        );

        await supabaseClient.auth.signOut();

        window.location.href =
            "mechanic-login.html";

        return;
    }


    // Approved mechanic
    currentMechanic = mechanic;

    document.getElementById(
        "mechanic-name"
    ).innerText =
        mechanic.business_name;


    loadQuoteRequests();
    loadBookings();
}

// Load quote requests
async function loadQuoteRequests() {

    const container =
        document.getElementById(
            "quote-requests"
        );

    const {
        data: requests,
        error
    } = await supabaseClient
        .from("mechanic_quote_requests")
        .select("*")
        .eq("mechanic_id", currentMechanic.id)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Error loading quote requests.</p>";

        return;
    }

    if (!requests || requests.length === 0) {

        container.innerHTML =
            "<p>No quote requests yet.</p>";

        return;
    }

    container.innerHTML =
        requests.map(request => `

            <div class="quote">

                <h3>
                    ${request.customer_name}
                </h3>

                <span class="status">
                    ${request.status}
                </span>

                <p>
                    <strong>Phone:</strong>
                    ${request.customer_phone}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${request.customer_email}
                </p>

                <p>
                    <strong>Vehicle:</strong>
                    ${request.vehicle}
                </p>

                <p>
                    <strong>Service:</strong>
                    ${request.service_required}
                </p>

                <p>
                    <strong>Problem:</strong>
                    ${request.problem_description || "Not provided"}
                </p>

                <p>
                    <strong>Preferred date:</strong>
                    ${request.preferred_date || "Not specified"}
                </p>

                <label>Response</label>

                <textarea
                    id="response-${request.id}"
                    placeholder="Enter your response to the customer..."
                >${request.mechanic_response || ""}</textarea>

                <label>Quoted Price (R)</label>

                <input
                    type="number"
                    id="price-${request.id}"
                    value="${request.quoted_price || ""}"
                    placeholder="Enter price"
                >

                <label>Status</label>

                <select id="status-${request.id}">

                    <option value="Pending"
                        ${request.status === "Pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Quoted"
                        ${request.status === "Quoted" ? "selected" : ""}>
                        Quoted
                    </option>

                    <option value="Accepted"
                        ${request.status === "Accepted" ? "selected" : ""}>
                        Accepted
                    </option>

                    <option value="Declined"
                        ${request.status === "Declined" ? "selected" : ""}>
                        Declined
                    </option>

                </select>

                <button
                    onclick="updateQuote('${request.id}')">
                    Send Quote
                </button>

            </div>

        `).join("");
}

    async function loadBookings() {

    const container =
        document.getElementById("bookings-container");

    if (!currentMechanic) {
        container.innerHTML =
            "<p>Mechanic account not found.</p>";
        return;
    }

    const { data: bookings, error } =
        await supabaseClient
        .from("mechanic_bookings")
        .select("*")
        .eq("mechanic_id", currentMechanic.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        container.innerHTML =
            "<p>Error loading bookings.</p>";
        return;
    }

    if (!bookings || bookings.length === 0) {
        container.innerHTML =
            "<p>No bookings yet.</p>";
        return;
    }

    container.innerHTML = bookings.map(booking => `

        <div style="
            border:1px solid #ddd;
            padding:20px;
            margin-bottom:20px;
            border-radius:8px;
        ">

            <h3>Booking</h3>

            <p>
                <strong>Customer:</strong>
                ${booking.customer_name}
            </p>

            <p>
                <strong>Phone:</strong>
                ${booking.customer_phone}
            </p>

            <p>
                <strong>Vehicle:</strong>
                ${booking.vehicle}
            </p>

            <p>
                <strong>Service:</strong>
                ${booking.service_required}
            </p>

            <p>
                <strong>Agreed Price:</strong>
                R${Number(booking.agreed_price).toLocaleString()}
            </p>

            <p>
                <strong>Booking Date:</strong>
                ${booking.booking_date || "Not selected"}
            </p>

            <p>
                <strong>Status:</strong>
                ${booking.status}
            </p>

            <select
                onchange="updateBookingStatus('${booking.id}', this.value)"
            >

                <option value="Accepted"
                    ${booking.status === "Accepted" ? "selected" : ""}>
                    Accepted
                </option>

                <option value="Scheduled"
                    ${booking.status === "Scheduled" ? "selected" : ""}>
                    Scheduled
                </option>

                <option value="In Progress"
                    ${booking.status === "In Progress" ? "selected" : ""}>
                    In Progress
                </option>

                <option value="Completed"
                    ${booking.status === "Completed" ? "selected" : ""}>
                    Completed
                </option>

            </select>

        </div>

    `).join("");
}


async function updateBookingStatus(bookingId, newStatus) {

    const { error } =
        await supabaseClient
        .from("mechanic_bookings")
        .update({
            status: newStatus
        })
        .eq("id", bookingId)
        .eq("mechanic_id", currentMechanic.id);

    if (error) {

        console.error(error);

        alert(
            "Unable to update booking: "
            + error.message
        );

        return;
    }

    alert("Booking status updated!");

    loadBookings();
}


// Update quote
async function updateQuote(requestId) {

    const response =
        document.getElementById(
            "response-" + requestId
        ).value;

    const price =
        document.getElementById(
            "price-" + requestId
        ).value;

    const status =
        document.getElementById(
            "status-" + requestId
        ).value;

    const {
        error
    } = await supabaseClient
        .from("mechanic_quote_requests")
        .update({
            mechanic_response: response,
            quoted_price: price || null,
            status: status
        })
        .eq("id", requestId)
        .eq(
            "mechanic_id",
            currentMechanic.id
        );

    if (error) {

        alert(
            "Error updating quote: " +
            error.message
        );

        return;
    }

    alert("Quote updated successfully!");

    loadQuoteRequests();
}

    
// Logout
async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "mechanic-login.html";
}


loadMechanic();

</script>

</body>
</html>
