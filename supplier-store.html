<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier | PoundTech</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.tech {
    color: red;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #111;
    text-decoration: none;
}

.supplier-header {
    background: white;
    padding: 30px;
    border-radius: 10px;
    margin-bottom: 30px;
}

.supplier-header h2 {
    margin-top: 0;
    font-size: 30px;
}

.verified {
    display: inline-block;
    background: #e8f7e8;
    color: #168000;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.products-heading {
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    cursor: pointer;
}

.product-image {
    width: 100%;
    height: 200px;
    background: #eee;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #cc0000;
}

@media (max-width: 700px) {

    .container {
        margin: 20px auto;
    }

}

</style>

</head>

<body>

<header>

<h1>
POUND<span class="tech">TECH</span>
</h1>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to Marketplace
</a>


<div id="supplier-container">

<p>
Loading supplier...
</p>

</div>


<h2 class="products-heading">
Products from this supplier
</h2>


<div
    id="products-container"
    class="products"
>

<p>
Loading products...
</p>

</div>

</div>


<script>

const SUPABASE_URL =
"https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let supplierId = null;


async function loadSupplier() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    supplierId =
        params.get("id");


    if (!supplierId) {

        document.getElementById(
            "supplier-container"
        ).innerHTML =
            "<p>Supplier not found.</p>";

        return;

    }


    const {
        data: supplier,
        error
    } =
        await supabaseClient

        .from("suppliers")

        .select("*")

        .eq("id", supplierId)

        .single();


    if (error || !supplier) {

        console.error(error);

        document.getElementById(
            "supplier-container"
        ).innerHTML =
            "<p>Unable to load supplier.</p>";

        return;

    }


    document.title =
        supplier.business_name +
        " | PoundTech";


    document.getElementById(
        "supplier-container"
    ).innerHTML = `

        <div class="supplier-header">

            <h2>
                ${supplier.business_name}
            </h2>

            ${
                supplier.status === "Approved"

                ?

                `
                <div class="verified">
                    ✓ Verified PoundTech Supplier
                </div>
                `

                :

                ""
            }


            <p>
                <strong>
                    Business type:
                </strong>

                ${supplier.business_type || "Not specified"}
            </p>


            <p>
                <strong>
                    Location:
                </strong>

                ${supplier.address || "Not specified"}
            </p>

        </div>

    `;


    loadSupplierProducts();

}


async function loadSupplierProducts() {

    const container =
        document.getElementById(
            "products-container"
        );


    const {
        data: products,
        error
    } =
        await supabaseClient

        .from("products")

        .select("*")

        .eq("supplier_id", supplierId)

        .eq("status", "Active")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load products.</p>";

        return;

    }


    if (!products || products.length === 0) {

        container.innerHTML =
            "<p>This supplier has no products listed yet.</p>";

        return;

    }


    container.innerHTML =

        products.map(product => `

            <div
                class="product"
                onclick="
                    window.location.href=
                    'product.html?id=${product.id}'
                "
            >

                <div class="product-image">

                    ${
                        product.image_url

                        ?

                        `
                        <img
                            src="${product.image_url}"
                            alt="${product.name}"
                        >
                        `

                        :

                        `
                        <div style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                        ">
                            No Image
                        </div>
                        `
                    }

                </div>


                <div class="product-info">

                    <h3>
                        ${product.name}
                    </h3>


                    <p>
                        ${product.category}
                    </p>


                    <div class="price">
                        R${product.price}
                    </div>


<div style="
    display:flex;
    gap:8px;
    margin-top:10px;
">

    <button
        onclick="
            event.stopPropagation();
            window.location.href=
            'product.html?id=${product.id}'
        "
    >
        View Product
    </button>

    <button
        onclick="
            event.stopPropagation();
            addSupplierProductToCart(
                '${product.id}',
                '${product.supplier_id}',
                '${product.name}',
                ${product.price},
                '${product.image_url || ""}'
            )
        "
        style="
            background:#111;
        "
    >
        Add to Cart
    </button>

</div>
                </div>

            </div>

        `).join("");

}

function addSupplierProductToCart(
    product_id,
    supplier_id,
    name,
    price,
    image_url
) {

    let cart =
        JSON.parse(
            localStorage.getItem("poundtechCart")
        ) || [];

    let existingProduct =
        cart.find(function(item) {
            return item.product_id === product_id;
        });

    if (existingProduct) {

        existingProduct.quantity += 1;

    } else {

        cart.push({

            product_id: product_id,
            supplier_id: supplier_id,
            name: name,
            price: price,
            quantity: 1,
            image_url: image_url

        });

    }

    localStorage.setItem(
        "poundtechCart",
        JSON.stringify(cart)
    );

    alert("Product added to cart!");

}
    
loadSupplier();

</script>

</body>

</html>
