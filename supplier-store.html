<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier | PoundTech</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pt-share.js?v=20261107"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.tech {
    color: red;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #111;
    text-decoration: none;
}

.supplier-header {
    background: white;
    padding: 30px;
    border-radius: 10px;
    margin-bottom: 30px;
}

.supplier-header h2 {
    margin-top: 0;
    font-size: 30px;
}

.verified {
    display: inline-block;
    background: #e8f7e8;
    color: #168000;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.products-heading {
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    cursor: pointer;
}

.product-image {
    width: 100%;
    height: 200px;
    background: #eee;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-top: 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #cc0000;
}

@media (max-width: 700px) {

    .container {
        margin: 20px auto;
    }

}

</style>

</head>

<body>

<header>

<h1>
POUND<span class="tech">TECH</span>
</h1>

</header>


<div class="container">

<a href="index.html" class="back">
← Back to Marketplace
</a>


<div id="supplier-container">

<p>
Loading supplier...
</p>

</div>


    
<h2 class="products-heading">
Products from this supplier
</h2>

<div id="supplier-fit-filter" style="display:none;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 16px;margin:-8px 0 20px;">
    <label for="supplier-vehicle-select" style="display:block;font-weight:bold;margin-bottom:8px;">Filter by My Garage vehicle</label>
    <select id="supplier-vehicle-select" style="width:100%;max-width:420px;padding:11px;border:1px solid #ccc;border-radius:7px;background:#fff;color:#111;">
        <option value="">All products</option>
    </select>
    <p id="supplier-fit-status" style="margin:9px 0 0;color:#666;font-size:13px;">Choose a saved vehicle to hide products known not to fit.</p>
</div>



<div
    id="products-container"
    class="products"
>

<p>
Loading products...
</p>

</div>
<div id="reviews-section" style="
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:30px;
">

    <h2 style="margin-top:0;">
        Supplier Reviews
    </h2>

    <div id="supplier-rating">
        Loading ratings...
    </div>

    <div id="reviews-container">
        Loading reviews...
    </div>
<hr style="
    margin:25px 0;
    border:none;
    border-top:1px solid #eee;
">

<h3>Leave a Review</h3>

<p style="color:#666;font-size:14px;">
    Reviews are verified against completed PoundTech orders.
</p>

<input
    id="review-order-number"
    type="text"
    placeholder="Order number (e.g. PT1790465694633)"
    style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:6px;
"
>

<input
    id="review-email"
    type="email"
    placeholder="Email used for your order"
    style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:6px;
"
>

<input
    id="review-name"
    type="text"
    placeholder="Your name"
    style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:6px;
"
>

<select
    id="review-rating"
    style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:6px;
"
>
    <option value="">Select rating</option>
    <option value="5">⭐⭐⭐⭐⭐ — Excellent</option>
    <option value="4">⭐⭐⭐⭐ — Good</option>
    <option value="3">⭐⭐⭐ — Average</option>
    <option value="2">⭐⭐ — Poor</option>
    <option value="1">⭐ — Very poor</option>
</select>

<textarea
    id="review-text"
    placeholder="Write your review..."
    rows="4"
    style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:6px;
        resize:vertical;
"
></textarea>

<button onclick="submitSupplierReview()">
    Submit Review
</button>

<div
    id="review-message"
    style="
        margin-top:15px;
        font-weight:bold;
    "
></div>

</div>
</div>


<script>

const SUPABASE_URL =
"https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

PT.init(supabaseClient);

let supplierId = null;
let supplierProducts = [];
let supplierVehicles = [];
let selectedSupplierVehicle = null;

async function loadSupplierVehicles() {
    const filter = document.getElementById("supplier-fit-filter");
    const select = document.getElementById("supplier-vehicle-select");
    const status = document.getElementById("supplier-fit-status");
    const { data: userData } = await supabaseClient.auth.getUser();

    filter.style.display = "block";

    if (!userData || !userData.user) {
        select.disabled = true;
        status.innerHTML = 'Sign in and add a vehicle to <a href="customer-login.html" style="color:#e00000;font-weight:bold;">My Garage</a> to filter by fitment.';
        return;
    }

    const { data, error } = await supabaseClient
        .from("customer_vehicles")
        .select("id, make, model, year, engine, nickname")
        .eq("user_id", userData.user.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("SUPPLIER STORE GARAGE ERROR:", error);
        status.textContent = "We couldn't load your saved vehicles. You can still browse all products.";
        return;
    }

    supplierVehicles = data || [];
    if (!supplierVehicles.length) {
        status.innerHTML = 'Add a vehicle to <a href="garage.html" style="color:#e00000;font-weight:bold;">My Garage</a> to filter this supplier’s products.';
        return;
    }

    select.innerHTML = '<option value="">All products</option>' + supplierVehicles.map(function (v) {
        const label = (v.nickname ? v.nickname + " — " : "") + v.year + " " + v.make + " " + v.model + (v.engine ? " (" + v.engine + ")" : "");
        return '<option value="' + PT.esc(v.id) + '">' + PT.esc(label) + '</option>';
    }).join("");

    select.addEventListener("change", function () {
        selectedSupplierVehicle = supplierVehicles.find(function (v) {
            return String(v.id) === select.value;
        }) || null;
        renderSupplierProducts();
    });
}

function renderSupplierProducts() {
    const container = document.getElementById("products-container");
    const status = document.getElementById("supplier-fit-status");
    let visible = supplierProducts;

    if (selectedSupplierVehicle) {
        visible = supplierProducts.filter(function (p) {
            const fit = PT.fit(p, selectedSupplierVehicle);
            return fit === "match" || fit === "universal" || fit === "unknown";
        });
        status.textContent = "Showing products that fit, may fit, or have no fitment details for your " +
            selectedSupplierVehicle.year + " " + selectedSupplierVehicle.make + " " + selectedSupplierVehicle.model + ". Known mismatches are hidden.";
    } else {
        status.textContent = supplierVehicles.length
            ? "Choose a saved vehicle to hide products known not to fit."
            : "Add a vehicle to My Garage to filter by fitment.";
    }

    if (!visible.length) {
        container.innerHTML = '<p>No products from this supplier match your selected vehicle.</p>';
        return;
    }

    container.innerHTML = visible.map(function (product) {
        const fit = selectedSupplierVehicle ? PT.fit(product, selectedSupplierVehicle) : "";
        const vehicleName = selectedSupplierVehicle ? PT.esc(selectedSupplierVehicle.make + " " + selectedSupplierVehicle.model) : "";
        const fitLabel = fit === "match"
            ? '<p style="color:#16803c;font-weight:bold;font-size:13px;">✓ Fits your ' + vehicleName + '</p>'
            : fit === "universal"
                ? '<p style="color:#777;font-size:13px;">Universal fitment — please confirm before buying</p>'
                : fit === "unknown"
                    ? '<p style="color:#777;font-size:13px;">Fitment not specified — please confirm before buying</p>'
                    : "";
        return `
            <div class="product" onclick="window.location.href='product.html?id=${encodeURIComponent(product.id)}'">
                <div class="product-image">
                    ${product.image_url ? '<img src="' + PT.esc(product.image_url) + '" alt="' + PT.esc(product.name) + '">' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">No Image</div>'}
                </div>
                <div class="product-info">
                    <h3>${PT.esc(product.name)}</h3>
                    <p>${PT.esc(product.category || "")}</p>
                    ${fitLabel}
                    <div class="price">${PT.money(product.price)}</div>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <button onclick="event.stopPropagation();window.location.href='product.html?id=${encodeURIComponent(product.id)}'">View Product</button>
                        <button onclick="event.stopPropagation();addSupplierProductToCart(${JSON.stringify(String(product.id))},${JSON.stringify(String(product.supplier_id))},${JSON.stringify(String(product.name || ""))},${Number(product.price)||0},${JSON.stringify(String(product.image_url || ""))})" style="background:#111;">Add to Cart</button>
                    </div>
                </div>
            </div>
        `;
    }).join("");
}


async function loadSupplier() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    supplierId =
        params.get("id");


    if (!supplierId) {

        document.getElementById(
            "supplier-container"
        ).innerHTML =
            "<p>Supplier not found.</p>";

        return;

    }


    const {
        data: supplier,
        error
    } =
        await supabaseClient

        .from("suppliers")

        .select("*")

        .eq("id", supplierId)

        .single();


    if (error || !supplier) {

        console.error(error);

        document.getElementById(
            "supplier-container"
        ).innerHTML =
            "<p>Unable to load supplier.</p>";

        return;

    }


    document.title =
        supplier.business_name +
        " | PoundTech";


    document.getElementById(
        "supplier-container"
    ).innerHTML = `

        <div class="supplier-header">

            <h2>
                ${supplier.business_name}
            </h2>

            ${
                supplier.status === "Approved"

                ?

                `
                <div class="verified">
                    ✓ Verified PoundTech Supplier
                </div>
                `

                :

                ""
            }


            <p>
                <strong>
                    Business type:
                </strong>

                ${supplier.business_type || "Not specified"}
            </p>


            <p>
                <strong>
                    Location:
                </strong>

                ${supplier.address || "Not specified"}
            </p>

        </div>

    `;


    loadSupplierProducts();

}


async function loadSupplierProducts() {

    const container =
        document.getElementById(
            "products-container"
        );


    const {
        data: products,
        error
    } =
        await supabaseClient

        .from("products")

        .select("*")

        .eq("supplier_id", supplierId)

        .eq("status", "Active")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load products.</p>";

        return;

    }


    if (!products || products.length === 0) {
        supplierProducts = [];
        container.innerHTML = "<p>This supplier has no products listed yet.</p>";
        return;
    }

    supplierProducts = products;
    renderSupplierProducts();

}

function addSupplierProductToCart(
    product_id,
    supplier_id,
    name,
    price,
    image_url
) {

    let cart =
        JSON.parse(
            localStorage.getItem("poundtechCart")
        ) || [];

    let existingProduct =
        cart.find(function(item) {
            return item.product_id === product_id;
        });

    if (existingProduct) {

        existingProduct.quantity += 1;

    } else {

        cart.push({

            product_id: product_id,
            supplier_id: supplier_id,
            name: name,
            price: price,
            quantity: 1,
            image_url: image_url

        });

    }

    localStorage.setItem(
        "poundtechCart",
        JSON.stringify(cart)
    );

    alert("Product added to cart!");

}

    async function loadSupplierReviews() {

    const ratingContainer =
        document.getElementById("supplier-rating");

    const reviewsContainer =
        document.getElementById("reviews-container");

    const {
        data: reviews,
        error
    } = await supabaseClient
        .from("supplier_reviews")
        .select("*")
        .eq("supplier_id", supplierId)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error("REVIEWS ERROR:", error);

        ratingContainer.innerHTML =
            "Unable to load ratings.";

        reviewsContainer.innerHTML = "";

        return;
    }

    if (!reviews || reviews.length === 0) {

        ratingContainer.innerHTML =
            "⭐ No ratings yet";

        reviewsContainer.innerHTML =
            "<p>This supplier has no reviews yet.</p>";

        return;
    }

    const average =
        reviews.reduce(
            (sum, review) =>
                sum + Number(review.rating),
            0
        ) / reviews.length;

    ratingContainer.innerHTML = `
        <div style="
            font-size:20px;
            font-weight:bold;
            margin-bottom:20px;
        ">
            ⭐ ${average.toFixed(1)} / 5
            <span style="
                font-size:14px;
                color:#666;
                font-weight:normal;
            ">
                (${reviews.length} reviews)
            </span>
        </div>
    `;

    reviewsContainer.innerHTML =
        reviews.map(review => `

            <div style="
                border-top:1px solid #eee;
                padding:15px 0;
            ">

                <strong>
                    ${review.customer_name}
                </strong>

                <div style="
                    margin:5px 0;
                ">
                    ${"⭐".repeat(Number(review.rating))}
                </div>

                <p style="
                    margin:5px 0;
                    color:#444;
                ">
                    ${review.review_text || ""}
                </p>

            </div>

        `).join("");
}

    async function submitSupplierReview() {

    const orderNumber =
        document.getElementById(
            "review-order-number"
        ).value.trim();

    const email =
        document.getElementById(
            "review-email"
        ).value.trim();

    const customerName =
        document.getElementById(
            "review-name"
        ).value.trim();

    const rating =
        Number(
            document.getElementById(
                "review-rating"
            ).value
        );

    const reviewText =
        document.getElementById(
            "review-text"
        ).value.trim();

    const message =
        document.getElementById(
            "review-message"
        );

    if (
        !orderNumber ||
        !email ||
        !customerName ||
        !rating ||
        !reviewText
    ) {

        message.style.color = "#e00000";

        message.innerText =
            "Please complete all fields.";

        return;
    }

    message.style.color = "#555";

    message.innerText =
        "Verifying your order...";

    const { data, error } =
        await supabaseClient.rpc(
            "submit_supplier_review",
            {
                p_order_number: orderNumber,
                p_email: email,
                p_supplier_id: supplierId,
                p_customer_name: customerName,
                p_rating: rating,
                p_review_text: reviewText
            }
        );

    if (error) {

        console.error(
            "REVIEW SUBMISSION ERROR:",
            error
        );

        message.style.color = "#e00000";

        message.innerText =
            "Unable to submit review.";

        return;
    }

    if (!data.success) {

        message.style.color = "#e00000";

        message.innerText =
            data.message;

        return;
    }

    message.style.color = "#168000";

    message.innerText =
        "✓ Review submitted successfully!";

    document.getElementById(
        "review-order-number"
    ).value = "";

    document.getElementById(
        "review-email"
    ).value = "";

    document.getElementById(
        "review-name"
    ).value = "";

    document.getElementById(
        "review-rating"
    ).value = "";

    document.getElementById(
        "review-text"
    ).value = "";

    loadSupplierReviews();
}
    
loadSupplier();
loadSupplierReviews();
loadSupplierVehicles();

</script>

</body>

</html>
