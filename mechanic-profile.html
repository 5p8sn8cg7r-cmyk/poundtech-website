<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mechanic Profile | PoundTech</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header strong {
            color: #e60000;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card,
        .reviews-card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .status {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .rating {
            font-size: 22px;
            margin: 15px 0;
        }

        .review {
            border-top: 1px solid #ddd;
            padding: 20px 0;
        }

        .review:first-child {
            border-top: none;
        }

        .stars {
            color: #f5b400;
            font-size: 20px;
        }

        .quote-button {
            display: inline-block;
            background: #e60000;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        .quote-button:hover {
            background: #c00000;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .business-type {
            display: inline-block;
            background: #fce8e8;
            color: #b00000;
            border: 1px solid #f3caca;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 12px;
        }

        .profile-services {
            margin-top: 28px;
            border-top: 1px solid #e5e5e5;
            padding-top: 18px;
        }

        .profile-service {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .profile-service h3 {
            margin: 0 0 6px;
            font-size: 16px;
        }

        .profile-service p {
            margin: 0;
            color: #666;
            font-size: 13px;
        }

        .profile-service-side {
            text-align: right;
            flex-shrink: 0;
        }

        .profile-service-price {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .profile-book {
            display: inline-block;
            background: #e60000;
            color: white;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .profile-book:hover {
            background: #c00000;
        }

        @media (max-width: 520px) {
            .container { margin: 15px auto; padding: 12px; }
            .profile-card, .reviews-card { padding: 20px; }
            .profile-service { align-items: flex-start; }
            .profile-service-side { min-width: 105px; }
        }

    </style>

  <link rel="icon" href="/favicon.ico?v=10" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=10">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=10">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png?v=10">
  <link rel="manifest" href="/site.webmanifest?v=10">
</head>

<body>

<header>

    <h1>
        POUND<strong>TECH</strong>
    </h1>

</header>


<div class="container">

    <div id="profile-container"
         class="loading">

        Loading mechanic...

    </div>


    <div id="reviews-container">

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );

const mechanicId =
    params.get("id");

const TYPE_LABELS = {
    mechanic: "Mechanic & automotive repairs",
    car_wash: "Car wash",
    detailer: "Vehicle detailing",
    panel_beater: "Panel beating & body repair",
    truck_fleet: "Truck, fleet & commercial services"
};

function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function formatPrice(value) {
    if (value === null || value === undefined || value === "") {
        return "Price on request";
    }
    return new Intl.NumberFormat("en-ZA", {
        style: "currency",
        currency: "ZAR",
        maximumFractionDigits: 2
    }).format(Number(value));
}

function formatDuration(value) {
    const minutes = Number(value);
    if (!minutes || minutes < 1) return "Duration confirmed by business";
    if (minutes < 60) return minutes + " min";
    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;
    return hours + " hr" + (hours === 1 ? "" : "s") +
        (remainder ? " " + remainder + " min" : "");
}


async function loadMechanicProfile() {

    const profileContainer =
        document.getElementById(
            "profile-container"
        );

    const reviewsContainer =
        document.getElementById(
            "reviews-container"
        );


    if (!mechanicId) {

        profileContainer.innerHTML =
            "<p>Mechanic not found.</p>";

        return;
    }


    const { data: mechanic, error } =
        await supabaseClient
        .from("mechanics")
        .select("*")
        .eq("id", mechanicId)
        .eq("status", "Approved")
        .single();


    if (error || !mechanic) {

        console.error(error);

        profileContainer.innerHTML =
            "<p>Unable to load mechanic.</p>";

        return;
    }


    const { data: services, error: servicesError } =
        await supabaseClient
        .from("business_services")
        .select("id, mechanic_id, name, description, price, duration_minutes, booking_mode, sort_order")
        .eq("mechanic_id", mechanicId)
        .eq("is_active", true)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });

    if (servicesError) {
        console.error("Unable to load business services:", servicesError);
    }

    const activeServices = services || [];
    const businessType = TYPE_LABELS[mechanic.business_type] || "Automotive services";

    const servicesHtml = activeServices.length
        ? activeServices.map(function (service) {
            const bookingUrl = "book.html?mechanic_id=" +
                encodeURIComponent(mechanicId) +
                "&service_id=" + encodeURIComponent(service.id);
            const actionLabel = service.booking_mode === "instant" ? "Book" : "Request";
            return '<div class="profile-service">' +
                '<div><h3>' + escapeHtml(service.name) + '</h3>' +
                '<p>' + escapeHtml(formatDuration(service.duration_minutes)) +
                (service.description ? ' · ' + escapeHtml(service.description) : '') +
                '</p></div>' +
                '<div class="profile-service-side"><div class="profile-service-price">' +
                escapeHtml(formatPrice(service.price)) + '</div>' +
                '<a class="profile-book" href="' + bookingUrl + '">' +
                actionLabel + '</a></div></div>';
        }).join("")
        : '<p>Contact this business for available services and pricing.</p>';

    const { data: reviews, error: reviewsError } =
        await supabaseClient
        .from("mechanic_reviews")
        .select("*")
        .eq("mechanic_id", mechanicId)
        .order("created_at", {
            ascending: false
        });


    if (reviewsError) {

        console.error(reviewsError);

    }


    const mechanicReviews =
        reviews || [];

    const reviewCount =
        mechanicReviews.length;


    const averageRating =
        reviewCount > 0
            ? (
                mechanicReviews.reduce(
                    (sum, review) =>
                        sum + review.rating,
                    0
                ) / reviewCount
              ).toFixed(1)
            : "No ratings";


    profileContainer.className =
        "profile-card";


    profileContainer.innerHTML = `

        <span class="status">
            Approved
        </span>

        <div class="business-type">
            ${escapeHtml(businessType)}
        </div>

        <h1>
            ${escapeHtml(mechanic.business_name)}
        </h1>

 <div class="rating">

    ${
        reviewCount > 0
            ? `
                <div>
                    ⭐ <strong>${averageRating}</strong>
                </div>

                <small>
                    ${reviewCount}
                    review${reviewCount === 1 ? "" : "s"}
                </small>
              `
            : `
                <div>
                    ⭐ No ratings yet
                </div>
              `
    }

</div>

        <p>
            📍
            <strong>Service Area:</strong>
            ${mechanic.service_area || "Not provided"}
        </p>

        <p>
            <strong>Services:</strong><br>
            ${mechanic.services || "Not provided"}
        </p>

        <p>
            ${mechanic.description || ""}
        </p>

        <section class="profile-services">
            <h2>Services &amp; Pricing</h2>
            ${servicesHtml}
        </section>

        <button
            class="quote-button"
            onclick="requestQuote()"
        >
            Request a Quote
        </button>

    `;


    if (mechanicReviews.length === 0) {

        reviewsContainer.innerHTML = `

            <div class="reviews-card">

                <h2>
                    Customer Reviews
                </h2>

                <p>
                    No reviews yet.
                </p>

            </div>

        `;

        return;
    }


    reviewsContainer.innerHTML = `

        <div class="reviews-card">

            <h2>
                Customer Reviews
            </h2>

            ${mechanicReviews.map(review => `

                <div class="review">

                    <div class="stars">

                        ${"★".repeat(review.rating)}
                        ${"☆".repeat(5 - review.rating)}

                    </div>

                    <p>
                        ${review.review || "No written review."}
                    </p>

                    <small>
                        ${review.customer_name}
                    </small>

                </div>

            `).join("")}

        </div>

    `;

}


function requestQuote() {

    window.location.href =
        "request-quote.html?mechanic_id="
        + mechanicId;

}


loadMechanicProfile();

</script>

</body>

</html>
