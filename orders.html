<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | PoundTech</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pt-share.js?v=20261106"></script>
  <link rel="icon" href="/favicon.ico?v=10" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=10">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=10">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png?v=10">
  <link rel="manifest" href="/site.webmanifest?v=10">
</head>

<body style="
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f5f7;
">

    <header style="
        background:#111;
        color:white;
        padding:20px;
    ">

        <h1 style="
            margin:0;
            font-size:24px;
        ">
            POUND<span style="color:red;">TECH</span>
        </h1>

    </header>

    <main style="
        max-width:900px;
        margin:40px auto;
        padding:0 20px;
    ">

        <h2>My Orders</h2>

        <p style="color:#666;">
            View your recent PoundTech orders.
        </p>

        <div id="orders-container">
            Loading orders...
        </div>

    </main>
<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

PT.init(supabaseClient);

async function loadOrders() {

    const container =
        document.getElementById("orders-container");

    const { data: orders, error } =
        await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load orders.</p>";

        return;
    }

    if (!orders || orders.length === 0) {

        container.innerHTML =
            "<p>You don't have any orders yet.</p>";

        return;
    }

    container.innerHTML =
        orders.map(order => `

            <div style="
                background:white;
                padding:20px;
                margin-bottom:15px;
                border-radius:10px;
                border:1px solid #ddd;
            ">

                <h3>
                    Order ${order.order_number}
                </h3>

                <p>
                    <strong>Status:</strong>
                    ${order.status}
                </p>

                <p>
                    <strong>Total:</strong>
                    R${order.total}
                </p>

                <p style="color:#777;">
                    ${new Date(order.created_at).toLocaleString()}
                </p>

                <button type="button" data-buy-again="${order.id}" style="margin-top:8px;padding:11px 16px;background:#111;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer;">
                    Buy these items again
                </button>

            </div>

        `).join("");
}

async function buyAgain(orderId, button) {
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "Loading items...";

    try {
        const { data: items, error: itemError } = await supabaseClient
            .from("order_items")
            .select("product_id, quantity")
            .eq("order_id", orderId);

        if (itemError) throw itemError;
        if (!items || !items.length) {
            PT.toast("No products were found for this order.");
            return;
        }

        const ids = Array.from(new Set(items.map(function (item) { return item.product_id; }).filter(Boolean)));
        const { data: products, error: productError } = await supabaseClient
            .from("products")
            .select("*")
            .in("id", ids)
            .eq("status", "Active");

        if (productError) throw productError;

        const byId = {};
        (products || []).forEach(function (product) { byId[String(product.id)] = product; });
        let cart = [];
        try { cart = JSON.parse(localStorage.getItem("poundtechCart")) || []; } catch (e) { cart = []; }
        let added = 0;
        let unavailable = 0;

        items.forEach(function (item) {
            const product = byId[String(item.product_id)];
            const stock = product ? Number(product.stock) || 0 : 0;
            if (!product || stock < 1) {
                unavailable++;
                return;
            }

            const quantity = Math.min(Math.max(1, Number(item.quantity) || 1), stock);
            const existing = cart.find(function (row) { return String(row.product_id) === String(product.id); });
            if (existing) {
                existing.quantity = Math.min((Number(existing.quantity) || 1) + quantity, stock);
                existing.price = PT.sale(product).now;
                existing.name = product.name;
                existing.supplier_id = product.supplier_id;
                existing.image_url = product.image_url || "";
            } else {
                cart.push({
                    product_id: product.id,
                    supplier_id: product.supplier_id,
                    name: product.name,
                    price: PT.sale(product).now,
                    quantity: quantity,
                    image_url: product.image_url || ""
                });
            }
            added++;
        });

        localStorage.setItem("poundtechCart", JSON.stringify(cart));
        if (added) {
            PT.toast(added + " product" + (added === 1 ? "" : "s") + " added to your cart" +
                (unavailable ? ". " + unavailable + " unavailable or out of stock." : "."));
            window.location.href = "/?cart=1";
        } else {
            PT.toast("Those products are no longer available.");
        }
    } catch (error) {
        console.error("BUY AGAIN ERROR:", error);
        PT.toast("We couldn't reload these items. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}

document.getElementById("orders-container").addEventListener("click", function (event) {
    const button = event.target.closest("[data-buy-again]");
    if (!button) return;
    buyAgain(button.getAttribute("data-buy-again"), button);
});

loadOrders();

</script>
  
</body>

</html>
