<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoundTech Supplier Admin</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header span {
    color: #e00000;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

#login {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

#login h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 12px 18px;
    background: #e00000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c00000;
}

.nav-links {
    margin-top: 14px;
}

.nav-links a {
    color: #c7c7c7;
    text-decoration: none;
    margin: 0 10px;
    font-size: 14px;
}

.nav-links a:hover {
    color: #e00000;
}

.supplier {
    background: white;
    margin-bottom: 20px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.supplier h2 {
    margin-top: 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 5px;
    background: #fff3cd;
    color: #856404;
    font-weight: bold;
}

.status-approved {
    background: #e6f4ea;
    color: #16803c;
}

.status-rejected {
    background: #fdecec;
    color: #8a1111;
}

.empty {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 10px;
}

#error {
    color: #c62828;
}

</style>
</head>

<body>

<header>

    <h1>POUND<span>TECH</span></h1>
    <p>Supplier Administration</p>

    <div class="nav-links">
        <a href="admin.html">Orders</a>
        <a href="admin-mechanics.html">Mechanic Applications</a>
        <a href="admin-suppliers.html">Supplier Applications</a>
    </div>

    <button id="logout" onclick="adminLogout()" style="margin-top:14px;">
        Logout
    </button>

</header>

<div class="container">

    <div id="login">

        <h2>Admin Login</h2>

        <input id="admin-email" type="email" placeholder="Admin email">
        <input id="admin-password" type="password" placeholder="Password">

        <button onclick="adminLogin()">Login</button>

        <p id="error"></p>

    </div>

    <div id="suppliers" style="display:none;"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-review.js?v=1"></script>

<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Cosmetic check only. The database enforces who is really admin (is_admin()).
const ADMIN_UID = "dd66c237-95cb-44c8-a43a-be823026fba8";


function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}


function showSuppliers() {
    document.getElementById("login").style.display = "none";
    document.getElementById("suppliers").style.display = "block";
    loadSuppliers();
}


async function adminLogin() {

    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        document.getElementById("error").textContent =
            "Login failed. Please check your email and password.";
        console.log("LOGIN ERROR:", error);
        return;
    }

    const user = data.user;

    if (!user) {
        document.getElementById("error").textContent =
            "No user account was returned after login.";
        return;
    }

    if (user.id.trim() !== ADMIN_UID.trim()) {
        document.getElementById("error").textContent =
            "You do not have permission to access the admin dashboard.";
        await supabaseClient.auth.signOut();
        return;
    }

    showSuppliers();
}


async function adminLogout() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        console.log("LOGOUT ERROR:", error);
        return;
    }

    document.getElementById("login").style.display = "block";
    document.getElementById("suppliers").style.display = "none";
}


function statusClass(status) {
    if (status === "Approved") return "status status-approved";
    if (status === "Rejected") return "status status-rejected";
    return "status";
}


async function loadSuppliers() {

    const { data: suppliers, error } = await supabaseClient
        .from("suppliers")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.log("SUPABASE ERROR:", error.message, error.details, error.hint, error.code);
        alert("Could not load suppliers.");
        return;
    }

    const container = document.getElementById("suppliers");

    container.innerHTML = "";

    if (!suppliers || suppliers.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <h2>No supplier applications yet</h2>
                <p>Supplier applications will appear here.</p>
            </div>
        `;
        return;
    }

    renderApplications("suppliers", suppliers, container, loadSuppliers);
}


async function updateSupplierStatus(id, newStatus) {

    if (!confirm("Mark this supplier as " + newStatus + "?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("suppliers")
        .update({ status: newStatus })
        .eq("id", id);

    if (error) {
        console.log("SUPABASE ERROR:", error.message, error.details, error.hint);
        alert("Could not update supplier status.");
        return;
    }

    loadSuppliers();
}


// Keep the admin signed in after a page refresh.
(async function restoreSession() {

    const { data } = await supabaseClient.auth.getSession();

    if (data && data.session && data.session.user.id === ADMIN_UID) {
        showSuppliers();
    }
})();

</script>

</body>
</html>
