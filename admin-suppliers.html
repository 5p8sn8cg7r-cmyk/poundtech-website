<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoundTech Supplier Admin</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header span {
    color: #e00000;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

#login {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

#login h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 12px 18px;
    background: #e00000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c00000;
}

#logout {
    float: right;
}

.supplier {
    background: white;
    margin-bottom: 20px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.supplier h2 {
    margin-top: 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 5px;
    background: #fff3cd;
    color: #856404;
    font-weight: bold;
}

.empty {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 10px;
}

#error {
    color: red;
}

</style>

</head>


<body>


<header>

<h1>POUND<span>TECH</span></h1>

<p>Supplier Administration</p>

<button id="logout" onclick="adminLogout()">
Logout
</button>

</header>


<div class="container">


<div id="login">

<h2>Admin Login</h2>

<input
id="admin-email"
type="email"
placeholder="Admin email"
>

<input
id="admin-password"
type="password"
placeholder="Password"
>

<button onclick="adminLogin()">
Login
</button>

<p id="error"></p>

</div>


<div id="suppliers" style="display:none;"></div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://uezacbssvvvtlosnaroh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



async function adminLogin() {


const email =
document.getElementById("admin-email").value;


const password =
document.getElementById("admin-password").value;


const { data, error } =
await supabaseClient.auth.signInWithPassword({

    email: email,

    password: password

});


if (error) {

    document.getElementById("error").textContent =
    "Login failed. Please check your email and password.";

    console.log("LOGIN ERROR:", error);

    return;

}


document.getElementById("login").style.display =
"none";


document.getElementById("suppliers").style.display =
"block";


loadSuppliers();

}



async function adminLogout() {


const { error } =
await supabaseClient.auth.signOut();


if (error) {

    console.log("LOGOUT ERROR:", error);

    return;

}


document.getElementById("login").style.display =
"block";


document.getElementById("suppliers").style.display =
"none";

}



async function loadSuppliers() {


const { data: suppliers, error } =
await supabaseClient

.from("suppliers")

.select("*")

.order("created_at", {
    ascending: false
});


if (error) {


console.log(
    "SUPABASE ERROR:",
    error.message,
    error.details,
    error.hint,
    error.code
);


alert("Could not load suppliers.");

return;

}


let container =
document.getElementById("suppliers");


container.innerHTML = "";


if (!suppliers || suppliers.length === 0) {


container.innerHTML = `

<div class="empty">

<h2>No supplier applications yet</h2>

<p>
Supplier applications will appear here.
</p>

</div>

`;


return;

}



suppliers.forEach(function(supplier) {


container.innerHTML += `

<div class="supplier">

<h2>
${supplier.business_name}
</h2>


<p>

<strong>Contact:</strong>
${supplier.contact_name}

</p>


<p>

<strong>Phone:</strong>
${supplier.phone}

</p>


<p>

<strong>Email:</strong>
${supplier.email}

</p>


<p>

<strong>Business Type:</strong>
${supplier.business_type}

</p>


<p>

<strong>Address:</strong>
${supplier.address}

</p>


<p>

<strong>Date Applied:</strong>
${supplier.created_at}

</p>


<p>

<strong>Status:</strong>

<span class="status">
${supplier.status}
</span>

</p>

<div>

<button onclick="updateSupplierStatus('${supplier.id}', 'Approved')">
Approve
</button>

<button
    onclick="updateSupplierStatus('${supplier.id}', 'Rejected')"
    style="background:#555; margin-left:10px;"
>
Reject
</button>

</div>

</div>

`;

});


}

    async function updateSupplierStatus(id, newStatus) {

    const { error } = await supabaseClient
        .from("suppliers")
        .update({
            status: newStatus
        })
        .eq("id", id);


    if (error) {

        console.log(
            "SUPABASE ERROR:",
            error.message,
            error.details,
            error.hint
        );

        alert("Could not update supplier status.");

        return;
    }


    alert(
        "Supplier status updated to " + newStatus
    );


    loadSuppliers();

}
    
</script>


</body>

</html>
