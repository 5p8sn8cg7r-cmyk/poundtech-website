<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Owned Listing | PoundTech</title>
<link rel="icon" href="/favicon.ico?v=10" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=10">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=10">
<link rel="apple-touch-icon" href="/favicon-180x180.png?v=10">
<link rel="stylesheet" href="site.css">

<style>

.listing-wrap {
    max-width: 920px;
    margin: 30px auto 60px;
    padding: 0 20px;
}

.back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
}
.back-link:hover { color: #e00000; }

.listing-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

@media (max-width: 760px) {
    .listing-grid { grid-template-columns: 1fr; }
}

.listing-grid img {
    width: 100%;
    border-radius: 12px;
    background: #eee;
    object-fit: cover;
    max-height: 460px;
}

.listing-grid h1 { margin: 0 0 6px; font-size: 24px; }

.price-tag {
    font-size: 28px;
    font-weight: bold;
    color: #e00000;
    margin: 6px 0 14px;
}

.condition-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
    background: #f4f5f7;
    color: #444;
    margin-right: 8px;
}

.disclaimer-box {
    background: #fff3cd;
    color: #7a5a00;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    margin: 18px 0;
}

.desc-block {
    margin: 18px 0;
    line-height: 1.6;
    white-space: pre-wrap;
}

.compat-block {
    font-size: 14px;
    color: #555;
    margin-bottom: 14px;
}

.buy-form input, .buy-form textarea {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    margin-bottom: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
}

.buy-form label { font-weight: bold; font-size: 14px; }

.btn-buy {
    width: 100%;
    padding: 14px;
    background: #e00000;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.btn-buy:hover { background: #c00000; }
.btn-buy:disabled { background: #ccc; cursor: not-allowed; }

.sold-badge {
    display: inline-block;
    background: #e8e8e8;
    color: #555;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
}

.message { font-size: 14px; margin-top: 10px; }
.message-error { color: #c62828; }
.message-success { color: #16803c; }

.hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }

</style>
<link rel="stylesheet" href="/back-button.css?v=20261111">
</head>

<body>

<header class="site-header">
    <a class="logo" href="/index.html">POUND<span>TECH</span></a>
    <a class="back pt-back-marketplace" href="/index.html">&larr; Back to marketplace</a>
</header>

<div class="listing-wrap">
    <a class="back-link" href="preowned.html">&larr; Back to Pre-Owned Parts</a>
    <div id="content"><p>Loading&hellip;</p></div>
</div>

<footer class="site-footer">
    <nav>
        <a href="terms.html">Terms &amp; Conditions</a>
        <a href="refunds.html">Refund &amp; Returns</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="delivery.html">Delivery Policy</a>
    </nav>
    <p>&copy; 2026 PoundTech. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const listingId = new URLSearchParams(window.location.search).get("id");


function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function money(value) {
    const n = Number(value) || 0;
    return "R" + n.toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}


async function loadListing() {

    const content = document.getElementById("content");

    if (!listingId) {
        content.innerHTML = "<p>Listing not found.</p>";
        return;
    }

    const { data: listing, error } = await supabaseClient
        .from("preowned_listings")
        .select("*")
        .eq("id", listingId)
        .maybeSingle();

    if (error || !listing) {
        content.innerHTML = "<p>This listing could not be found.</p>";
        return;
    }

    const available = listing.status === "Active" && listing.listing_review === "approved";
    const sold = listing.status === "Sold";
    const reserved = listing.status === "Reserved";

    let buyBlock = "";

    if (sold) {
        buyBlock = '<p class="sold-badge">Sold</p>';
    } else if (reserved) {
        buyBlock = '<p class="sold-badge">Sale in progress</p>';
    } else if (!available) {
        buyBlock = '<p class="sold-badge">Not currently available</p>';
    } else {
        buyBlock = `
            <div class="buy-form">
                <div id="buy-message"></div>
                <label for="buyer-name">Your name</label>
                <input id="buyer-name" type="text" placeholder="Full name">
                <label for="buyer-phone">Phone number</label>
                <input id="buyer-phone" type="tel" placeholder="Phone number">
                <label for="buyer-email">Email address</label>
                <input id="buyer-email" type="email" placeholder="Email">
                <label for="buyer-address">Delivery / collection address</label>
                <textarea id="buyer-address" rows="3" placeholder="Where should this be delivered, or where will you collect from?"></textarea>
                <div class="hp" aria-hidden="true">
                    <label for="buyer-website">Leave this empty</label>
                    <input id="buyer-website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <button class="btn-buy" id="buy-button" onclick="buyNow()">Buy Now &mdash; ${money(listing.price)}</button>
            </div>
        `;
    }

    content.innerHTML = `
        <div class="listing-grid">
            <div>
                <img src="${esc(listing.image_url || '')}" alt="${esc(listing.title)}">
            </div>
            <div>
                <h1>${esc(listing.title)}</h1>
                <div class="price-tag">${money(listing.price)}</div>
                <span class="condition-tag">${esc(listing.condition)}</span>
                <span class="condition-tag">${esc(listing.category)}</span>

                <div class="disclaimer-box">
                    Private seller &middot; sold as-is. This item is sold directly by an individual seller and
                    is not inspected, warrantied or guaranteed by PoundTech.
                </div>

                ${listing.vehicle_compatibility ? `<div class="compat-block"><strong>Fits:</strong> ${esc(listing.vehicle_compatibility)}</div>` : ""}

                <div class="desc-block">${esc(listing.description)}</div>

                ${buyBlock}
            </div>
        </div>
    `;
}


async function buyNow() {

    if (document.getElementById("buyer-website").value) { return; }

    const name = document.getElementById("buyer-name").value.trim();
    const phone = document.getElementById("buyer-phone").value.trim();
    const email = document.getElementById("buyer-email").value.trim();
    const address = document.getElementById("buyer-address").value.trim();

    const msg = document.getElementById("buy-message");
    const button = document.getElementById("buy-button");

    if (!name || !phone || !email || !address) {
        msg.innerHTML = '<p class="message message-error">Please fill in all fields.</p>';
        return;
    }

    button.disabled = true;
    msg.innerHTML = '<p class="message">Reserving this item&hellip;</p>';

    const { data, error } = await supabaseClient.rpc("place_preowned_order", {
        p_listing_id: listingId,
        p_name: name,
        p_phone: phone,
        p_email: email,
        p_address: address
    });

    if (error) {
        button.disabled = false;
        console.log("SUPABASE ERROR:", error.message);
        msg.innerHTML = '<p class="message message-error">' + esc(error.message || "This item could not be reserved.") + '</p>';
        return;
    }

    const orderNumber = data && data.order_number;

    if (!orderNumber) {
        button.disabled = false;
        msg.innerHTML = '<p class="message message-error">Something went wrong. Please try again.</p>';
        return;
    }

    msg.innerHTML = '<p class="message message-success">Taking you to secure payment&hellip;</p>';
    await startPayment(orderNumber);
}

// Shared Yoco checkout redirect, same flow as the main marketplace checkout.
async function startPayment(orderNumber) {

    let redirectUrl = null;
    let message = "";

    try {
        const { data, error } = await supabaseClient.functions.invoke("create-yoco-checkout", {
            body: { order_number: orderNumber }
        });

        if (error) {
            message = "We couldn't start the payment.";
            try {
                const detail = await error.context.json();
                if (detail && detail.error) { message = detail.error; }
            } catch (e) { /* keep the general message */ }
        } else if (data && data.redirectUrl) {
            redirectUrl = data.redirectUrl;
        } else {
            message = "We couldn't start the payment.";
        }
    } catch (e) {
        console.error(e);
        message = "We couldn't start the payment.";
    }

    if (redirectUrl) {
        window.location.href = redirectUrl;
        return;
    }

    document.getElementById("buy-message").innerHTML =
        '<p class="message message-error">' + esc(message) + ' Please try again.</p>';
    document.getElementById("buy-button").disabled = false;
}

loadListing();

</script>

<script src="nav.js"></script>
</body>
</html>
