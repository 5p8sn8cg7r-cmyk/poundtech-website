.listing-wrap { max-width:1100px; margin:26px auto 64px; }
.back-link {
    display:inline-flex; align-items:center; gap:7px; margin:0 0 17px;
    padding:9px 13px; border:1px solid #e6e6e8; border-radius:9px;
    background:#fff; color:#444; font-weight:600; transition:all .15s ease;
}

.listing-grid {
    align-items:start; gap:26px; padding:22px;
    background:#fff; border:1px solid #e9e9eb; border-radius:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.055);
}
.photo-gallery { position:sticky; top:18px; }
.gallery-main {
    display:block; width:100%; aspect-ratio:4/3; max-height:520px;

    flex-basis:78px; width:78px; height:66px; border:2px solid #e6e6e8;

}
.gallery-thumb:hover { border-color:#c7c7c7; }
.gallery-thumb.active { border-color:#e00000; }
.listing-grid h1 { font-size:clamp(22px,3vw,30px); line-height:1.25; letter-spacing:-.5px; }
.price-tag { font-size:30px; letter-spacing:-.7px; margin:10px 0 16px; }

    margin:0 6px 8px 0; padding:6px 11px; border:1px solid #e8e8e8;

    margin:18px 0; padding:14px 15px; border:1px solid #f0dfb8;

}

.buy-form input:focus, .buy-form textarea:focus {

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const listingId = new URLSearchParams(window.location.search).get("id");


function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function money(value) {
    const n = Number(value) || 0;
    return "R" + n.toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getPreownedVisitorToken() {
    const storageKey = "pt_preowned_visitor";
    try {
        let token = localStorage.getItem(storageKey);
        if (!token) {
            token = window.crypto && typeof window.crypto.randomUUID === "function"
                ? window.crypto.randomUUID()
                : "pt-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
            localStorage.setItem(storageKey, token);
        }
        return token;
    } catch (e) {
        return null;
    }
}

function trackPreownedListingView(id) {
    const visitorToken = getPreownedVisitorToken();
    if (!visitorToken) return;
    supabaseClient.rpc("record_preowned_listing_view", {
        p_listing_id: id,
        p_visitor_token: visitorToken
    }).then(function (result) {
        if (result.error) console.warn("Listing view could not be recorded:", result.error.message);
    });
}


async function loadListing() {

    const content = document.getElementById("content");

    if (!listingId) {
        content.innerHTML = "<p>Listing not found.</p>";
        return;
    }

    const { data: listing, error } = await supabaseClient
        .from("preowned_listings")
        .select("*")
        .eq("id", listingId)
        .maybeSingle();

    if (error || !listing) {
        content.innerHTML = "<p>This listing could not be found.</p>";
        return;
    }

    const available = listing.status === "Active" && listing.listing_review === "approved";
    const sold = listing.status === "Sold";
    const reserved = listing.status === "Reserved";

    if (available) {
        trackPreownedListingView(listing.id);
    }

    let buyBlock = "";

    if (sold) {
        buyBlock = '<p class="sold-badge">Sold</p>';
    } else if (reserved) {
        buyBlock = '<p class="sold-badge">Sale in progress</p>';
    } else if (!available) {
        buyBlock = '<p class="sold-badge">Not currently available</p>';
    } else {
        buyBlock = `
            <div class="buy-form">
                <div id="buy-message"></div>
                <label for="buyer-name">Your name</label>
                <input id="buyer-name" type="text" placeholder="Full name">
                <label for="buyer-phone">Phone number</label>
                <input id="buyer-phone" type="tel" placeholder="Phone number">
                <label for="buyer-email">Email address</label>
                <input id="buyer-email" type="email" placeholder="Email">
                <label for="buyer-address">Delivery / collection address</label>
                <textarea id="buyer-address" rows="3" placeholder="Where should this be delivered, or where will you collect from?"></textarea>
                <div class="hp" aria-hidden="true">
                    <label for="buyer-website">Leave this empty</label>
                    <input id="buyer-website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <button class="btn-buy" id="buy-button" onclick="buyNow()">Buy Now &mdash; ${money(listing.price)}</button>
            </div>
        `;
    }

    const galleryImages = [listing.image_url].concat(Array.isArray(listing.extra_images) ? listing.extra_images : []).filter(Boolean);

    content.innerHTML = `
        <div class="listing-grid">
            <div class="photo-gallery">
                <img id="gallery-main-image" class="gallery-main" src="${esc(galleryImages[0] || '')}" alt="${esc(listing.title)}">
                ${galleryImages.length > 1 ? `<div class="gallery-thumbs">${galleryImages.map(function (url, index) { return `<button type="button" class="gallery-thumb ${index === 0 ? 'active' : ''}" data-gallery-src="${esc(url)}" aria-label="View product photo ${index + 1}"><img src="${esc(url)}" alt=""></button>`; }).join('')}</div>` : ""}
            </div>
            <div>
                <h1>${esc(listing.title)}</h1>
                ${listing.promotion_expires_at && new Date(listing.promotion_expires_at) > new Date() && listing.promotion_type !== "none" ? `<div class="promo-badge">${listing.promotion_type === "category" ? "Top of Category" : listing.promotion_type === "featured" ? "Featured Listing" : "Boosted Listing"}</div>` : ""}
                <div class="price-tag">${money(listing.price)}</div>
                <span class="condition-tag">${esc(listing.condition)}</span>
                <span class="condition-tag">${esc(listing.category)}</span>

                <div class="disclaimer-box">
                    Private seller &middot; sold as-is. This item is sold directly by an individual seller and
                    is not inspected, warrantied or guaranteed by PoundTech.
                </div>

                ${listing.vehicle_compatibility ? `<div class="compat-block"><strong>Fits:</strong> ${esc(listing.vehicle_compatibility)}</div>` : ""}

                <div class="desc-block">${esc(listing.description)}</div>

                ${buyBlock}
            </div>
        </div>
    `;

    content.querySelectorAll(".gallery-thumb").forEach(function (button) {
        button.addEventListener("click", function () {
            const mainImage = document.getElementById("gallery-main-image");
            if (mainImage) mainImage.src = button.dataset.gallerySrc;
            content.querySelectorAll(".gallery-thumb").forEach(function (thumb) {
                thumb.classList.toggle("active", thumb === button);
            });
        });
    });
}


async function buyNow() {

    if (document.getElementById("buyer-website").value) { return; }

    const name = document.getElementById("buyer-name").value.trim();
    const phone = document.getElementById("buyer-phone").value.trim();
    const email = document.getElementById("buyer-email").value.trim();
    const address = document.getElementById("buyer-address").value.trim();

    const msg = document.getElementById("buy-message");
    const button = document.getElementById("buy-button");

    if (!name || !phone || !email || !address) {
        msg.innerHTML = '<p class="message message-error">Please fill in all fields.</p>';
        return;
    }

    button.disabled = true;
    msg.innerHTML = '<p class="message">Reserving this item&hellip;</p>';

    const { data, error } = await supabaseClient.rpc("place_preowned_order", {
        p_listing_id: listingId,
        p_name: name,
        p_phone: phone,
        p_email: email,
        p_address: address
    });

    if (error) {
        button.disabled = false;
        console.log("SUPABASE ERROR:", error.message);
        msg.innerHTML = '<p class="message message-error">' + esc(error.message || "This item could not be reserved.") + '</p>';
        return;
    }

    const orderNumber = data && data.order_number;

    if (!orderNumber) {
        button.disabled = false;
        msg.innerHTML = '<p class="message message-error">Something went wrong. Please try again.</p>';
        return;
    }

    if (window.PTReferral) {
        const referralResult = await window.PTReferral.attach("Private Seller Sale", orderNumber, email);
        if (referralResult && referralResult.error) console.warn("Referral attribution could not be attached:", referralResult.error);
    }

    msg.innerHTML = '<p class="message message-success">Taking you to secure payment&hellip;</p>';
    await startPayment(orderNumber);
}

// Shared Yoco checkout redirect, same flow as the main marketplace checkout.
async function startPayment(orderNumber) {

    let redirectUrl = null;
    let message = "";

    try {
        const { data, error } = await supabaseClient.functions.invoke("create-yoco-checkout", {
            body: { order_number: orderNumber }
        });

        if (error) {
            message = "We couldn't start the payment.";
            try {
                const detail = await error.context.json();
                if (detail && detail.error) { message = detail.error; }
            } catch (e) { /* keep the general message */ }
        } else if (data && data.redirectUrl) {
            redirectUrl = data.redirectUrl;
        } else {
            message = "We couldn't start the payment.";
        }
    } catch (e) {
        console.error(e);
        message = "We couldn't start the payment.";
    }

    if (redirectUrl) {
        window.location.href = redirectUrl;
        return;
    }

    document.getElementById("buy-message").innerHTML =
        '<p class="message message-error">' + esc(message) + ' Please try again.</p>';
    document.getElementById("buy-button").disabled = false;
}

loadListing();

</script>
