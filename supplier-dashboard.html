<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoundTech Supplier Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
}

header {
    background: #111;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

header span {
    color: #e00000;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
    padding: 12px 18px;
    background: #e00000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c00000;
}

.logout {
    float: right;
    background: #555;
}

.status {
    font-weight: bold;
}

</style>

</head>


<body>


<header>

<h1>
POUND<span>TECH</span>
</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</header>


<div class="container">


<div class="card">

<h2>Supplier Dashboard</h2>

<p id="welcome">
Loading supplier information...
</p>

<p>

<strong>Application Status:</strong>

<span id="status">
Checking...
</span>

</p>

</div>


<div class="card">

<h2>Products</h2>

<p>
Manage your products and stock below.
</p>

<button onclick="showAddProductForm()">
Add Product
</button>
    
<div id="supplier-products" style="margin-top:20px;">
    <p>Loading your products...</p>
</div>
    
    <div id="add-product-form" style="display:none; margin-top:20px;">

    <input
        type="text"
        id="product-name"
        placeholder="Product name"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >

    <select
        id="product-category"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >
        <option value="">Select category</option>
        <option value="Engine Parts">Engine Parts</option>
        <option value="Wheels & Tyres">Wheels & Tyres</option>
        <option value="Lighting">Lighting</option>
        <option value="Exterior">Exterior</option>
        <option value="Car Audio">Car Audio</option>
        <option value="Interior">Interior</option>
    </select>

    <textarea
        id="product-description"
        placeholder="Product description"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    ></textarea>

    <input
        type="number"
        id="product-price"
        placeholder="Price (R)"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >

    <input
        type="number"
        id="product-stock"
        placeholder="Stock quantity"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >

    <input
        type="text"
        id="product-image"
        placeholder="Image URL"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >

    <input
        type="text"
        id="vehicle-compatibility"
        placeholder="Vehicle compatibility (e.g. VW Polo 2018-2022)"
        style="display:block; margin-bottom:10px; padding:10px; width:100%;"
    >

    <button onclick="addProduct()">
        Save Product
    </button>

    <button
        onclick="hideAddProductForm()"
        style="background:#555; margin-left:10px;"
    >
        Cancel
    </button>

    <p id="product-message"></p>

</div>

</div>


<div class="card">

<h2>Orders</h2>

<p>
Your supplier orders will appear here.
</p>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://uezacbssvvvtlosnaroh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



async function loadSupplier() {


const {
    data: { user },
    error
} = await supabaseClient.auth.getUser();


if (error || !user) {

    window.location.href =
    "supplier-login.html";

    return;

}


document.getElementById("welcome").textContent =
"Logged in as " + user.email;



const { data: supplier, error: supplierError } =
await supabaseClient

.from("suppliers")

.select("*")

.eq("user_id", user.id)

.single();
    
if (supplierError) {

    console.log(
        "SUPPLIER ERROR:",
        supplierError.message
    );

    document.getElementById("status").textContent =
    "Supplier application not found.";

    return;

}


document.getElementById("status").textContent =
supplier.status;


if (supplier.status !== "Approved") {

    document.getElementById("status").textContent =
    supplier.status + " — awaiting approval";

}

}



async function logout() {


const { error } =
await supabaseClient.auth.signOut();


if (error) {

    console.log("LOGOUT ERROR:", error);

    return;

}


window.location.href =
"supplier-login.html";

}



loadSupplier();

    function showAddProductForm() {
    document.getElementById("add-product-form").style.display = "block";
}

function hideAddProductForm() {
    document.getElementById("add-product-form").style.display = "none";
}

async function addProduct() {

    const name = document.getElementById("product-name").value;
    const category = document.getElementById("product-category").value;
    const description = document.getElementById("product-description").value;
    const price = document.getElementById("product-price").value;
    const stock = document.getElementById("product-stock").value;
    const image_url = document.getElementById("product-image").value;
    const vehicle_compatibility = document.getElementById("vehicle-compatibility").value;

    const message = document.getElementById("product-message");

    if (!name || !category || !price) {
        message.textContent = "Please fill in the product name, category and price.";
        return;
    }

    message.textContent = "Saving product...";

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        message.textContent = "You must be logged in.";
        return;
    }

    const { data: supplier, error: supplierError } =
        await supabaseClient
        .from("suppliers")
        .select("id")
        .eq("user_id", user.id)
        .single();

    if (supplierError || !supplier) {
        message.textContent = "Supplier account not found.";
        return;
    }

    const { error } = await supabaseClient
        .from("products")
        .insert([{
            supplier_id: supplier.id,
            name: name,
            category: category,
            description: description,
            price: Number(price),
            stock: Number(stock) || 0,
            image_url: image_url,
            vehicle_compatibility: vehicle_compatibility,
            status: "Active"
        }]);

    if (error) {
        console.error(error);
        message.textContent = "Error saving product: " + error.message;
        return;
    }

    message.textContent = "Product added successfully!";

    document.getElementById("product-name").value = "";
    document.getElementById("product-category").value = "";
    document.getElementById("product-description").value = "";
    document.getElementById("product-price").value = "";
    document.getElementById("product-stock").value = "";
    document.getElementById("product-image").value = "";
    document.getElementById("vehicle-compatibility").value = "";
}

    async function loadSupplierProducts() {

    const productsContainer = document.getElementById("supplier-products");

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        productsContainer.innerHTML = "<p>Please log in.</p>";
        return;
    }

    const { data: supplier, error: supplierError } =
        await supabaseClient
        .from("suppliers")
        .select("id")
        .eq("user_id", user.id)
        .single();

    if (supplierError || !supplier) {
        productsContainer.innerHTML = "<p>Supplier account not found.</p>";
        return;
    }

    const { data: products, error } =
        await supabaseClient
        .from("products")
        .select("*")
        .eq("supplier_id", supplier.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        productsContainer.innerHTML =
            "<p>Error loading products.</p>";
        return;
    }

    if (!products || products.length === 0) {
        productsContainer.innerHTML =
            "<p>You haven't added any products yet.</p>";
        return;
    }

    productsContainer.innerHTML = products.map(product => `
        <div style="
            border:1px solid #ddd;
            padding:15px;
            margin-bottom:15px;
            border-radius:8px;
        ">
            <h3>${product.name}</h3>

            <p>
                <strong>Category:</strong>
                ${product.category}
            </p>

            <p>
                <strong>Price:</strong>
                R${product.price}
            </p>

            <p>
                <strong>Stock:</strong>
                ${product.stock}
            </p>

            <p>
                <strong>Vehicle compatibility:</strong>
                ${product.vehicle_compatibility || "Not specified"}
            </p>

            <p>
                <strong>Status:</strong>
                ${product.status}
            </p>

            <button onclick="editProduct('${product.id}')">
    Edit Product
</button>

<button
    onclick="deleteProduct('${product.id}')"
    style="background:#555; margin-left:10px;"
>
    Delete Product
</button>      

</div>
    `).join("");
}
    loadSupplierProducts();
    
async function editProduct(productId) {

    const { data: product, error } =
        await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();

    if (error || !product) {
        alert("Unable to load product.");
        return;
    }

    const newName = prompt("Product name:", product.name);
    if (newName === null) return;

    const newPrice = prompt("Price (R):", product.price);
    if (newPrice === null) return;

    const newStock = prompt("Stock quantity:", product.stock);
    if (newStock === null) return;

    const newDescription = prompt(
        "Description:",
        product.description || ""
    );
    if (newDescription === null) return;

    const newCompatibility = prompt(
        "Vehicle compatibility:",
        product.vehicle_compatibility || ""
    );
    if (newCompatibility === null) return;

    const { error: updateError } =
        await supabaseClient
        .from("products")
        .update({
            name: newName,
            price: Number(newPrice),
            stock: Number(newStock),
            description: newDescription,
            vehicle_compatibility: newCompatibility
        })
        .eq("id", productId);

    if (updateError) {
        console.error(updateError);
        alert("Unable to update product.");
        return;
    }

    alert("Product updated successfully!");

    loadSupplierProducts();
}
   
    <button
    onclick="deleteProduct('${product.id}')"
    style="background:#555; margin-left:10px;"
>
    Delete Product
</button>

</script>


</body>

</html>
