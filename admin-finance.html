<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PoundTech Finance</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header strong {
            color: #e60000;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin-top: 0;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        .status {
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

    </style>

</head>


<body>

<header>

    <h1>
        POUND<strong>TECH</strong>
    </h1>

    <p>
        Finance Dashboard
    </p>

</header>


<div class="container">

    <div id="loading"
         class="loading">

        Loading financial data...

    </div>


    <div id="dashboard"
         style="display:none;">

        <div class="stats">

            <div class="stat-card">

                <h3>
                    Total Sales
                </h3>

                <div
                    id="total-sales"
                    class="stat-value">
                    R0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    PoundTech Commission
                </h3>

                <div
                    id="total-commission"
                    class="stat-value">
                    R0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Supplier / Mechanic Amount
                </h3>

                <div
                    id="total-provider"
                    class="stat-value">
                    R0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Pending Commission
                </h3>

                <div
                    id="pending-commission"
                    class="stat-value">
                    R0
                </div>

            </div>

        </div>


        <div class="table-container">

            <h2>
                Transactions
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>
                            Type
                        </th>

                        <th>
                            Gross Amount
                        </th>

                        <th>
                            Commission
                        </th>

                        <th>
                            Provider
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>

                <tbody id="transactions">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://uezacbssvvvtlosnaroh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadFinance() {

    const loading =
        document.getElementById("loading");

    const dashboard =
        document.getElementById("dashboard");


    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        loading.innerHTML = `
            <h2>Admin Login Required</h2>

            <p>
                Please log in through the PoundTech admin page first.
            </p>

            <button
                onclick="window.location.href='admin.html'"
                style="
                    padding:12px 20px;
                    background:#e60000;
                    color:white;
                    border:none;
                    border-radius:6px;
                    cursor:pointer;
                "
            >
                Go to Admin Login
            </button>
        `;

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("commissions")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        loading.innerHTML =
            "Unable to load financial data.";

        return;
    }


    const transactions =
        data || [];


    let totalSales = 0;
    let totalCommission = 0;
    let totalProvider = 0;
    let pendingCommission = 0;


    transactions.forEach(transaction => {

        totalSales +=
            Number(transaction.gross_amount) || 0;

        totalCommission +=
            Number(transaction.commission_amount) || 0;

        totalProvider +=
            Number(transaction.provider_amount) || 0;

        if (transaction.status === "Pending") {

            pendingCommission +=
                Number(transaction.commission_amount) || 0;

        }

    });


    document.getElementById("total-sales").textContent =
        "R" + totalSales.toLocaleString();


    document.getElementById("total-commission").textContent =
        "R" + totalCommission.toLocaleString();


    document.getElementById("total-provider").textContent =
        "R" + totalProvider.toLocaleString();


    document.getElementById("pending-commission").textContent =
        "R" + pendingCommission.toLocaleString();


    const table =
        document.getElementById("transactions");


    if (transactions.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    No transactions yet.
                </td>
            </tr>
        `;

    } else {

        table.innerHTML =
            transactions.map(transaction => `

                <tr>

                    <td>
                        ${transaction.transaction_type}
                    </td>

                    <td>
                        R${Number(
                            transaction.gross_amount
                        ).toLocaleString()}
                    </td>

                    <td>
                        R${Number(
                            transaction.commission_amount
                        ).toLocaleString()}
                    </td>

                    <td>
                        R${Number(
                            transaction.provider_amount
                        ).toLocaleString()}
                    </td>

                    <td>
                        ${transaction.status}
                    </td>

                    <td>
                        ${new Date(
                            transaction.created_at
                        ).toLocaleDateString()}
                    </td>

                </tr>

            `).join("");

    }


    loading.style.display = "none";
    dashboard.style.display = "block";
}


loadFinance();
    
</script>

</body>

</html>
