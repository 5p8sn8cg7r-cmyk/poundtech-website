<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoundTech Private Sellers</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header span {
    color: #e00000;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

#login {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

#login h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 12px 18px;
    background: #e00000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c00000;
}

.nav-links {
    margin-top: 14px;
}

.nav-links a {
    color: #c7c7c7;
    text-decoration: none;
    margin: 0 10px;
    font-size: 14px;
}

.nav-links a:hover {
    color: #e00000;
}

.supplier {
    background: white;
    margin-bottom: 20px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.supplier h2 {
    margin-top: 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 5px;
    background: #fff3cd;
    color: #856404;
    font-weight: bold;
}

.status-approved {
    background: #e6f4ea;
    color: #16803c;
}

.status-rejected {
    background: #fdecec;
    color: #8a1111;
}

.empty {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 10px;
}

#error {
    color: #c62828;
}

</style>
</head>

<body>

<header>

    <h1>POUND<span>TECH</span></h1>
    <p>Private Seller Administration</p>

    <div class="nav-links">
        <a href="admin.html">Orders</a>
        <a href="admin-mechanics.html">Mechanic Applications</a>
        <a href="admin-suppliers.html">Supplier Applications</a>
        <a href="admin-private-sellers.html">Private Sellers</a>
    </div>

    <button id="logout" onclick="adminLogout()" style="margin-top:14px;">
        Logout
    </button>

</header>

<div class="container">

    <div id="login">

        <h2>Admin Login</h2>

        <input id="admin-email" type="email" placeholder="Admin email">
        <input id="admin-password" type="password" placeholder="Password">

        <button onclick="adminLogin()">Login</button>

        <p id="error"></p>

    </div>

    <div id="private_sellers" style="display:none;"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_UID = "dd66c237-95cb-44c8-a43a-be823026fba8";
const DOC_BUCKET = "private-seller-documents";

function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function showError(message) {
    document.getElementById("error").textContent = message || "";
}

function showPrivateSellers() {
    document.getElementById("login").style.display = "none";
    document.getElementById("private_sellers").style.display = "block";
    loadPrivateSellers();
}

async function adminLogin() {
    showError("");
    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error || !data.user) {
        showError("Login failed. Please check your email and password.");
        return;
    }
    if (data.user.id !== ADMIN_UID) {
        showError("You do not have permission to access this page.");
        await supabaseClient.auth.signOut();
        return;
    }
    showPrivateSellers();
}

async function adminLogout() {
    await supabaseClient.auth.signOut();
    document.getElementById("login").style.display = "block";
    document.getElementById("private_sellers").style.display = "none";
    showError("");
}

function statusClass(status) {
    if (status === "Approved") return "status status-approved";
    if (status === "Rejected") return "status status-rejected";
    return "status";
}

async function loadPrivateSellers() {
    const container = document.getElementById("private_sellers");
    container.innerHTML = '<div class="empty">Loading applications…</div>';

    const { data, error } = await supabaseClient
        .from("private_sellers")
        .select("id,full_name,phone,id_document_path,status,review_notes,terms_accepted_at,created_at")
        .order("created_at", { ascending: true });

    if (error) {
        container.innerHTML = '<div class="empty">Could not load applications: ' + esc(error.message) + '</div>';
        return;
    }
    if (!data || !data.length) {
        container.innerHTML = '<div class="empty"><h2>No private-seller applications yet</h2><p>New applications will appear here.</p></div>';
        return;
    }

    container.innerHTML = data.map(function (s) {
        return '<section class="supplier" data-id="' + esc(s.id) + '">' +
            '<h2>' + esc(s.full_name) + ' <span class="' + statusClass(s.status) + '">' + esc(s.status) + '</span></h2>' +
            '<p><strong>Phone:</strong> ' + esc(s.phone) + '</p>' +
            '<p><strong>Applied:</strong> ' + esc(new Date(s.created_at).toLocaleString("en-ZA")) + '</p>' +
            '<p><strong>Terms accepted:</strong> ' + esc(new Date(s.terms_accepted_at).toLocaleString("en-ZA")) + '</p>' +
            '<p><button type="button" data-action="document" data-path="' + esc(s.id_document_path) + '">Open ID document securely</button></p>' +
            '<label>Internal review notes</label>' +
            '<textarea class="review-notes" style="width:100%;min-height:75px;padding:10px;box-sizing:border-box;">' + esc(s.review_notes || "") + '</textarea>' +
            '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;">' +
            '<button type="button" data-action="approve">Approve</button>' +
            '<button type="button" data-action="more-info" style="background:#777;">Request more information</button>' +
            '<button type="button" data-action="reject" style="background:#8a1111;">Reject</button>' +
            '<button type="button" data-action="save" style="background:#333;">Save notes</button>' +
            '</div></section>';
    }).join("");

    container.querySelectorAll("button[data-action]").forEach(function (button) {
        button.addEventListener("click", function () {
            const card = button.closest("[data-id]");
            reviewAction(card, button.dataset.action, button.dataset.path);
        });
    });
}

async function reviewAction(card, action, path) {
    const id = card.dataset.id;

    if (action === "document") {
        const { data, error } = await supabaseClient.storage
            .from(DOC_BUCKET).createSignedUrl(path, 120);
        if (error || !data || !data.signedUrl) {
            alert("Could not open the ID document: " + (error ? error.message : "No signed link returned."));
            return;
        }
        window.open(data.signedUrl, "_blank", "noopener");
        return;
    }

    const notes = card.querySelector(".review-notes").value.trim();
    const update = { review_notes: notes || null };

    if (action === "approve") {
        if (!confirm("Approve this private seller?")) return;
        update.status = "Approved";
    } else if (action === "reject") {
        if (!confirm("Reject this application?")) return;
        update.status = "Rejected";
    } else if (action === "more-info") {
        update.status = "More information required";
    }

    const { error } = await supabaseClient
        .from("private_sellers")
        .update(update)
        .eq("id", id);

    if (error) {
        alert("Could not update the application: " + error.message);
        return;
    }
    await loadPrivateSellers();
}

(async function restoreSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user.id === ADMIN_UID) {
        showPrivateSellers();
    } else if (data && data.session) {
        await supabaseClient.auth.signOut();
    }
})();

</script>

</body>
</html>
