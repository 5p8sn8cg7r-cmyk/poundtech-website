<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | PoundTech</title>
<link rel="stylesheet" href="site.css">

<style>

.product-main {
    max-width: 1100px;
    margin: 30px auto 60px;
    padding: 0 20px;
}

.product-page {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 20px rgba(0, 0, 0, 0.08);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 520px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.category-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #f4f5f7;
    color: #444;
    font-size: 13px;
    font-weight: bold;
}

.product-info h1 {
    font-size: 30px;
    line-height: 1.2;
    margin: 12px 0 8px;
}

.sold-by { color: #555; font-size: 15px; }

.sold-by a {
    color: #e00000;
    font-weight: bold;
    text-decoration: none;
}

.price {
    font-size: 30px;
    font-weight: bold;
    margin: 18px 0;
}

.desc { color: #333; margin-bottom: 16px; }

.meta-row { font-size: 15px; margin-bottom: 8px; }
.meta-row strong { color: #555; }

.fit-ok {
    display: inline-block;
    margin: 4px 8px 4px 0;
    padding: 6px 12px;
    border-radius: 6px;
    background: #e6f4ea;
    color: #16803c;
    font-size: 14px;
    font-weight: bold;
}

.stock-in  { color: #16803c; font-weight: bold; }
.stock-low { color: #8a5a00; font-weight: bold; }
.stock-out { color: #b80000; font-weight: bold; }

.qty {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 20px;
}

.qty button {
    width: 40px;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    font-size: 20px;
    cursor: pointer;
}

.qty button:hover { border-color: #e00000; }

.qty span {
    min-width: 30px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.actions-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.notice {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 20px rgba(0, 0, 0, 0.08);
}

.more { margin-top: 40px; }

.more h2 { font-size: 22px; margin-bottom: 4px; }

.more-sub { color: #666; font-size: 14px; margin-bottom: 16px; }

.more-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
}

.more-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    overflow: hidden;
    cursor: pointer;
}

.more-card .mc-image {
    position: relative;
    height: 150px;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 13px;
    font-weight: bold;
}

.more-card .mc-image img { width: 100%; height: 100%; object-fit: cover; }

.more-card .mc-info { padding: 12px 14px 14px; }

.more-card h3 { font-size: 15px; margin-bottom: 4px; }

.more-card .mc-fit { font-size: 12px; font-weight: bold; color: #16803c; margin-bottom: 4px; }

.more-card .mc-price { font-weight: bold; font-size: 17px; }

@media (max-width: 800px) {

    .more-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .more-card .mc-image { height: 120px; }

    .product-page {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 20px;
    }

    .product-info h1 { font-size: 24px; }
}

</style>
</head>

<body>

<header class="site-header">
    <a class="logo" href="index.html">POUND<span>TECH</span></a>
    <a class="back" href="index.html">&larr; Back to marketplace</a>
</header>

<main class="product-main">
    <div id="product-container">
        <div class="notice">Loading product&hellip;</div>
    </div>

    <section class="more" id="more-section" hidden>
        <h2>More like this</h2>
        <p class="more-sub" id="more-sub"></p>
        <div class="more-grid" id="more-grid"></div>
    </section>
</main>

<footer class="site-footer">
    <nav>
        <a href="terms.html">Terms &amp; Conditions</a>
        <a href="refunds.html">Refund &amp; Returns</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="delivery.html">Delivery Policy</a>
    </nav>
    <p>&copy; 2026 PoundTech. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pt-share.js"></script>

<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

PT.init(supabaseClient);

const esc = PT.esc;

let currentProduct = null;
let selectedQuantity = 1;


function money(value) {
    const n = Number(value);
    return "R" + n.toLocaleString("en-ZA", {
        minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
        maximumFractionDigits: 2
    });
}

function notice(html) {
    document.getElementById("product-container").innerHTML = '<div class="notice">' + html + '</div>';
}


async function loadProduct() {

    const productId = new URLSearchParams(window.location.search).get("id");

    if (!productId) {
        notice("Product not found. <a href='index.html' style='color:#e00000;font-weight:bold;'>Back to the marketplace</a>");
        return;
    }

    const { data: product, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .maybeSingle();

    if (error) {
        console.error(error);
        notice("We couldn't load this product right now. Please try again shortly.");
        return;
    }

    if (!product || (product.status && product.status !== "Active")) {
        notice("This product is no longer available. <a href='index.html' style='color:#e00000;font-weight:bold;'>Back to the marketplace</a>");
        return;
    }

    currentProduct = product;

    document.title = product.name + " | PoundTech";

    let supplier = null;

    if (product.supplier_id) {

        const supplierResult = await supabaseClient
            .from("suppliers")
            .select("business_name, status")
            .eq("id", product.supplier_id)
            .maybeSingle();

        if (supplierResult.error) {
            console.error("SUPPLIER ERROR:", supplierResult.error);
        } else {
            supplier = supplierResult.data;
        }
    }

    const stock = Number(product.stock) || 0;

    const stockHtml =
        stock <= 0  ? '<span class="stock-out">Out of stock</span>' :
        stock <= 5  ? '<span class="stock-low">Only ' + esc(stock) + ' left</span>' :
                      '<span class="stock-in">In stock</span>';

    selectedQuantity = stock > 0 ? 1 : 0;

    document.getElementById("product-container").innerHTML = `
        <div class="product-page">

            <div class="product-image">
                ${product.image_url
                    ? `<img src="${esc(product.image_url)}" alt="${esc(product.name)}">`
                    : "No image"}
            </div>

            <div class="product-info">

                <span class="category-tag">${esc(product.category)}</span>

                <h1>${esc(product.name)}</h1>

                <div class="sold-by">
                    ${supplier
                        ? 'Sold by <a href="supplier-store.html?id=' + encodeURIComponent(product.supplier_id) + '">' + esc(supplier.business_name) + '</a>'
                        : "Supplier not available"}
                </div>

                <div class="price">${esc(money(product.price))}</div>

                <p class="desc">${esc(product.description || "No description available.")}</p>

                <div class="meta-row">
                    <strong>Vehicle compatibility:</strong>
                    ${esc(product.vehicle_compatibility || "Not specified")}
                </div>

                <div id="fit-badges"></div>

                <div class="meta-row">${stockHtml}</div>

                ${stock > 0 ? `
                    <div class="qty">
                        <button type="button" id="qty-minus" aria-label="Decrease quantity">&minus;</button>
                        <span id="qty-value">1</span>
                        <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
                    </div>
                ` : ""}

                <button type="button" class="btn" id="add-cart-btn" ${stock > 0 ? "" : "disabled"}>
                    ${stock > 0 ? "Add to Cart" : "Out of stock"}
                </button>

                <div class="actions-row">
                    ${PT.heartPill(product.id)}
                    ${PT.sharePill({ id: product.id, name: product.name, price: product.price })}
                </div>

            </div>

        </div>
    `;

    PT.refresh();

    if (stock > 0) {
        document.getElementById("qty-minus").addEventListener("click", function () { changeQuantity(-1); });
        document.getElementById("qty-plus").addEventListener("click", function () { changeQuantity(1); });
        document.getElementById("add-cart-btn").addEventListener("click", addToCart);
    }

    showFitBadges(product);
    loadSimilar(product);
}


// "More like this": same category first, then other products to fill the row.
// Items that fit one of the customer's garage vehicles are shown first.
async function loadSimilar(product) {

    const LIMIT = 6;

    function inStock(p) { return Number(p.stock) > 0; }

    let list = [];

    const same = await supabaseClient
        .from("products")
        .select("*")
        .eq("status", "Active")
        .eq("category", product.category)
        .neq("id", product.id)
        .limit(24);

    if (!same.error && same.data) { list = same.data.filter(inStock); }

    let usedOthers = false;

    if (list.length < LIMIT) {

        const others = await supabaseClient
            .from("products")
            .select("*")
            .eq("status", "Active")
            .neq("id", product.id)
            .limit(24);

        if (!others.error && others.data) {
            const have = {};
            list.forEach(function (p) { have[p.id] = true; });
            others.data.forEach(function (p) {
                if (!have[p.id] && inStock(p)) { list.push(p); usedOthers = true; }
            });
        }
    }

    if (list.length === 0) { return; }

    let vehicles = [];

    const { data: sessionData } = await supabaseClient.auth.getSession();

    if (sessionData && sessionData.session) {
        const result = await supabaseClient
            .from("customer_vehicles")
            .select("id, make, model, year, engine, nickname")
            .eq("user_id", sessionData.session.user.id);
        if (!result.error && result.data) { vehicles = result.data; }
    }

    function fitVehicle(p) {
        return vehicles.find(function (v) { return PT.fit(p, v) === "match"; }) || null;
    }

    // Same vehicle: fits one of the customer's cars, or lists a vehicle the viewed product lists too.
    function words(text) {
        return String(text || "").toLowerCase().split(/[^a-z0-9]+/).filter(function (w) { return w.length > 2 && w !== "universal" && w !== "all"; });
    }

    const baseWords = words(product.vehicle_compatibility);

    function sharesVehicle(p) {
        const w = words(p.vehicle_compatibility);
        return w.some(function (x) { return baseWords.indexOf(x) !== -1; });
    }

    const base = Number(product.price) || 0;

    list = list
        .map(function (p) {
            return {
                p: p,
                v: fitVehicle(p),
                same: sharesVehicle(p),
                sameCat: p.category === product.category ? 0 : 1,
                gap: Math.abs((Number(p.price) || 0) - base)
            };
        })
        .sort(function (a, b) {
            if (a.sameCat !== b.sameCat) { return a.sameCat - b.sameCat; }
            if (!!a.v !== !!b.v) { return a.v ? -1 : 1; }
            if (a.same !== b.same) { return a.same ? -1 : 1; }
            return a.gap - b.gap;
        })
        .slice(0, LIMIT);

    document.getElementById("more-sub").textContent = usedOthers
        ? "Other parts customers are looking at."
        : "More in " + product.category + ".";

    document.getElementById("more-grid").innerHTML = list.map(function (row) {

        const p = row.p;

        return `
            <div class="more-card" data-open="${esc(p.id)}">
                <div class="mc-image">
                    ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : "No image"}
                    ${PT.cardActions({ id: p.id, name: p.name, price: p.price })}
                </div>
                <div class="mc-info">
                    ${row.v ? '<div class="mc-fit">Fits your ' + esc(row.v.make + " " + row.v.model) + '</div>' : ""}
                    <h3>${esc(p.name)}</h3>
                    <div class="mc-price">${esc(money(p.price))}</div>
                </div>
            </div>`;
    }).join("");

    document.getElementById("more-section").hidden = false;

    PT.refresh();
}


document.getElementById("more-grid").addEventListener("click", function (e) {

    const card = e.target.closest("[data-open]");

    if (card && !e.target.closest("[data-pt-fav], [data-pt-share], .pt-actions")) {
        window.location.href = "product.html?id=" + encodeURIComponent(card.getAttribute("data-open"));
    }
});


function changeQuantity(amount) {

    const stock = Number(currentProduct.stock) || 0;

    selectedQuantity = Math.max(1, Math.min(stock, selectedQuantity + amount));

    document.getElementById("qty-value").textContent = selectedQuantity;
}


function addToCart() {

    const product = currentProduct;

    let cart = [];

    try {
        cart = JSON.parse(localStorage.getItem("poundtechCart")) || [];
    } catch (e) {
        cart = [];
    }

    const existing = cart.find(function (item) { return item.product_id === product.id; });

    if (existing) {
        existing.quantity = Number(existing.quantity || 1) + selectedQuantity;
    } else {
        cart.push({
            product_id: product.id,
            supplier_id: product.supplier_id,
            name: product.name,
            price: Number(product.price),
            quantity: selectedQuantity,
            image_url: product.image_url || ""
        });
    }

    localStorage.setItem("poundtechCart", JSON.stringify(cart));

    PT.toast(product.name + " added to cart");
}


// For logged-in customers: show which of their garage vehicles this fits.
async function showFitBadges(product) {

    const { data: sessionData } = await supabaseClient.auth.getSession();

    if (!sessionData || !sessionData.session) { return; }

    const { data: vehicles, error } = await supabaseClient
        .from("customer_vehicles")
        .select("id, make, model, year, engine, nickname")
        .eq("user_id", sessionData.session.user.id);

    if (error || !vehicles) { return; }

    const fits = vehicles.filter(function (v) { return PT.fit(product, v) === "match"; });

    document.getElementById("fit-badges").innerHTML = fits.map(function (v) {
        return '<span class="fit-ok">Fits your ' + esc(v.year + " " + v.make + " " + v.model) + '</span>';
    }).join("");
}


loadProduct();

</script>

</body>
</html>
