<script>

const SUPABASE_URL = "https://uezacbssvvvtlosnaroh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Abl4zMUx_hMAsk6gjk6oGw_ak7ybUJQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

PT.init(supabaseClient);

const esc = PT.esc;

let currentProduct = null;
let selectedQuantity = 1;


function money(value) { return PT.money(value); }

function notice(html) {
    document.getElementById("product-container").innerHTML = '<div class="notice">' + html + '</div>';
}


function productKey(p) {
    return [p.price, p.sale_price, p.sale_ends_at, p.sale_label, p.stock, p.status, p.name, p.image_url, (p.extra_images || []).join(",")].join("|");
}


// Customer vehicles are fetched once and shared by the fit badges and "More like this".
let vehiclesPromise = null;

function getVehicles() {

    if (!vehiclesPromise) {
        vehiclesPromise = (async function () {

            const { data: sessionData } = await supabaseClient.auth.getSession();

            if (!sessionData || !sessionData.session) { return []; }

            const result = await supabaseClient
                .from("customer_vehicles")
                .select("id, make, model, year, engine, nickname")
                .eq("user_id", sessionData.session.user.id);

            return result.error || !result.data ? [] : result.data;
        })();
    }

    return vehiclesPromise;
}


async function fetchSupplier(supplierId) {

    if (!supplierId) { return null; }

    const result = await supabaseClient
        .from("suppliers")
        .select("business_name, status")
        .eq("id", supplierId)
        .maybeSingle();

    if (result.error) {
        console.error("SUPPLIER ERROR:", result.error);
        return null;
    }

    return result.data;
}


function fillSupplier(product, supplier) {

    const el = document.getElementById("sold-by");

    if (!el) { return; }

    el.innerHTML = supplier
        ? 'Sold by <a href="supplier-store.html?id=' + encodeURIComponent(product.supplier_id) + '">' + esc(supplier.business_name) + '</a>'
        : (product.supplier_id ? "&nbsp;" : "Supplier not available");
}


async function loadProduct() {

    const productId = new URLSearchParams(window.location.search).get("id");

    if (!productId) {
        notice("Product not found. <a href='/' style='color:#e00000;font-weight:bold;'>Back to the marketplace</a>");
        return;
    }

    // If you tapped a card, we already have most of the product: show it now,
    // and fetch everything else at the same time.
    const cached = PT.cached(productId);

    if (cached) {
        renderProduct(cached);
        getVehicles().then(function () { showFitBadges(cached); });
    }

    const supplierEarly = cached && cached.supplier_id ? fetchSupplier(cached.supplier_id) : null;
    const similarEarly = cached ? loadSimilar(cached) : null;

    const { data: product, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .maybeSingle();

    if (error) {
        console.error(error);
        if (!cached) { notice("We couldn't load this product right now. Please try again shortly."); }
        return;
    }

    if (!product || (product.status && product.status !== "Active")) {
        notice("This product is no longer available. <a href='/' style='color:#e00000;font-weight:bold;'>Back to the marketplace</a>");
        return;
    }

    currentProduct = product;

    document.title = product.name + " | PoundTech";

    if (!cached || productKey(cached) !== productKey(product)) {
        renderProduct(product);
    }

    showFitBadges(product);

    loadReviews(product);

    if (!similarEarly) { loadSimilar(product); }

    const supplier = await (supplierEarly || fetchSupplier(product.supplier_id));

    fillSupplier(product, supplier);
}


function photosOf(product) {

    const list = [];

    if (product.image_url) { list.push(product.image_url); }

    if (Array.isArray(product.extra_images)) {
        product.extra_images.forEach(function (u) { if (u) { list.push(u); } });
    }

    return list.slice(0, 3);
}


function galleryHtml(product) {

    const photos = photosOf(product);

    if (photos.length === 0) { return "No image"; }

    if (photos.length === 1) {
        return '<img src="' + esc(photos[0]) + '" alt="' + esc(product.name) + '" fetchpriority="high" style="width:100%;height:100%;object-fit:cover;">';
    }

    return '<div class="pg-track" id="pg-track">' +
        photos.map(function (url, i) {
            return '<div class="pg-slide"><img src="' + esc(url) + '" alt="' + esc(product.name) + ' photo ' + (i + 1) + '"' +
                   (i === 0 ? ' fetchpriority="high"' : ' loading="lazy"') + '></div>';
        }).join("") +
        '</div>' +
        '<button type="button" class="pg-arrow pg-prev" id="pg-prev" aria-label="Previous photo">&lsaquo;</button>' +
        '<button type="button" class="pg-arrow pg-next" id="pg-next" aria-label="Next photo">&rsaquo;</button>' +
        '<span class="pg-count" id="pg-count">1 / ' + photos.length + '</span>';
}


function thumbsHtml(product) {

    const photos = photosOf(product);

    if (photos.length < 2) { return ""; }

    return '<div class="pg-thumbs" id="pg-thumbs">' +
        photos.map(function (url, i) {
            return '<button type="button" class="pg-thumb' + (i === 0 ? " on" : "") + '" data-i="' + i + '" aria-label="Show photo ' + (i + 1) + '">' +
                   '<img src="' + esc(PT.thumb(url)) + '" data-full="' + esc(url) + '" alt="" onerror="PT.imgFallback(this)"></button>';
        }).join("") +
        '</div><p class="pg-hint">Swipe the photo to see more</p>';
}


// Swipe (scroll-snap), arrows on desktop, and thumbnails all stay in step.
function setupGallery() {

    const track = document.getElementById("pg-track");

    if (!track) { return; }

    const thumbs = Array.from(document.querySelectorAll("#pg-thumbs .pg-thumb"));
    const count = document.getElementById("pg-count");
    const total = thumbs.length;

    function current() {
        return Math.max(0, Math.min(total - 1, Math.round(track.scrollLeft / track.clientWidth)));
    }

    function show(i) {
        thumbs.forEach(function (t, k) { t.classList.toggle("on", k === i); });
        count.textContent = (i + 1) + " / " + total;
    }

    function goTo(i) {
        i = Math.max(0, Math.min(total - 1, i));
        track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
        show(i);
    }

    track.addEventListener("scroll", function () { show(current()); }, { passive: true });

    thumbs.forEach(function (t) {
        t.addEventListener("click", function () { goTo(Number(t.getAttribute("data-i"))); });
    });

    document.getElementById("pg-prev").addEventListener("click", function () { goTo(current() - 1); });
    document.getElementById("pg-next").addEventListener("click", function () { goTo(current() + 1); });
}


// Tap the main photo to view all photos full screen.
function setupLightbox(product) {

    const photos = photosOf(product);
    const main = document.getElementById("pg-main");

    if (!main || photos.length === 0) { return; }

    main.addEventListener("click", function (e) {

        if (e.target.closest(".pg-arrow")) { return; }

        const track = document.getElementById("pg-track");
        const start = track && track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0;

        openLightbox(product, photos, start);
    });
}


function openLightbox(product, photos, start) {

    if (document.getElementById("pg-lightbox")) { return; }

    const box = document.createElement("div");
    box.id = "pg-lightbox";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-label", "Product photos");

    box.innerHTML =
        '<button type="button" class="lb-close" aria-label="Close photos">&times;</button>' +
        '<span class="lb-count"></span>' +
        '<div class="lb-track">' +
        photos.map(function (url, i) {
            return '<div class="lb-slide"><img src="' + esc(url) + '" alt="' + esc(product.name) + ' photo ' + (i + 1) + '"></div>';
        }).join("") +
        '</div>' +
        (photos.length > 1
            ? '<button type="button" class="lb-arrow lb-prev" aria-label="Previous photo">&lsaquo;</button>' +
              '<button type="button" class="lb-arrow lb-next" aria-label="Next photo">&rsaquo;</button>'
            : "");

    document.body.appendChild(box);

    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";

    const track = box.querySelector(".lb-track");
    const count = box.querySelector(".lb-count");

    function current() {
        return Math.max(0, Math.min(photos.length - 1, Math.round(track.scrollLeft / track.clientWidth)));
    }

    function update() {
        count.textContent = photos.length > 1 ? (current() + 1) + " / " + photos.length : "";
    }

    function goTo(i) {
        i = Math.max(0, Math.min(photos.length - 1, i));
        track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
    }

    function close() {
        document.removeEventListener("keydown", onKey);
        document.body.style.overflow = previousOverflow;
        box.remove();
        // keep the page gallery on the photo the customer ended on
        const pageTrack = document.getElementById("pg-track");
        if (pageTrack) { pageTrack.scrollTo({ left: current() * pageTrack.clientWidth }); }
    }

    function onKey(e) {
        if (e.key === "Escape") { close(); }
        else if (e.key === "ArrowLeft") { goTo(current() - 1); }
        else if (e.key === "ArrowRight") { goTo(current() + 1); }
    }

    document.addEventListener("keydown", onKey);

    track.scrollLeft = start * track.clientWidth;
    update();

    track.addEventListener("scroll", update, { passive: true });

    box.querySelector(".lb-close").addEventListener("click", close);

    // Tapping the dark area (not the photo) closes it too.
    track.addEventListener("click", function (e) {
        if (e.target.tagName !== "IMG") { close(); }
    });

    const prev = box.querySelector(".lb-prev");
    const next = box.querySelector(".lb-next");

    if (prev) { prev.addEventListener("click", function () { goTo(current() - 1); }); }
    if (next) { next.addEventListener("click", function () { goTo(current() + 1); }); }
}


function renderProduct(product) {

    currentProduct = product;

    const stock = Number(product.stock) || 0;

    const stockHtml =
        stock <= 0  ? '<span class="stock-out">Out of stock</span>' :
        stock <= 5  ? '<span class="stock-low">Only ' + esc(stock) + ' left</span>' :
                      '<span class="stock-in">In stock</span>';

    selectedQuantity = stock > 0 ? Math.min(Math.max(1, selectedQuantity || 1), stock) : 0;

    document.getElementById("product-container").innerHTML = `
        <div class="product-page">

            <div class="gallery">
                <div class="product-image${photosOf(product).length ? " has-photos" : ""}" id="pg-main">
                    ${galleryHtml(product)}
                    ${PT.ribbons(product)}
                </div>
                ${thumbsHtml(product)}
            </div>

            <div class="product-info">

                <span class="category-tag">${esc(product.category)}</span>

                <h1>${esc(product.name)}</h1>

                <div class="rating-line" id="rating-line"></div>

                <div class="sold-by" id="sold-by">&nbsp;</div>

                ${PT.price(product, { large: true })}

                <p class="desc">${esc(product.description || "No description available.")}</p>

                <div class="meta-row">
                    <strong>Vehicle compatibility:</strong>
                    ${esc(product.vehicle_compatibility || "Not specified")}
                </div>

                <div id="fit-badges"></div>

                <div class="meta-row">${stockHtml}</div>

                ${stock > 0 ? `
                    <div class="qty">
                        <button type="button" id="qty-minus" aria-label="Decrease quantity">&minus;</button>
                        <span id="qty-value">${selectedQuantity}</span>
                        <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
                    </div>
                ` : ""}

                <button type="button" class="btn" id="add-cart-btn" ${stock > 0 ? "" : "disabled"}>
                    ${stock > 0 ? "Add to Cart" : "Out of stock"}
                </button>

                ${stock > 0 ? '<button type="button" class="btn btn-dark" id="buy-now-btn" style="margin-top:10px;">Buy Now</button>' : ""}

                <div class="actions-row">
                    ${PT.heartPill(product.id)}
                    ${PT.sharePill(product)}
                </div>

            </div>

        </div>
    `;

    PT.refresh();

    setupGallery();
    setupLightbox(product);

    if (stock > 0) {
        document.getElementById("qty-minus").addEventListener("click", function () { changeQuantity(-1); });
        document.getElementById("qty-plus").addEventListener("click", function () { changeQuantity(1); });
        document.getElementById("add-cart-btn").addEventListener("click", addToCart);
        document.getElementById("buy-now-btn").addEventListener("click", buyNow);
    }
}


function changeQuantity(amount) {

    const stock = Number(currentProduct.stock) || 0;

    selectedQuantity = Math.max(1, Math.min(stock, selectedQuantity + amount));

    document.getElementById("qty-value").textContent = selectedQuantity;
}


function addToCart() {
    addProductToCart(currentProduct, selectedQuantity);
}


// Adds the item and goes straight to checkout.
function buyNow() {
    addProductToCart(currentProduct, selectedQuantity);
    window.location.href = "/?checkout=1";
}


function addProductToCart(product, quantity) {

    let cart = [];

    try {
        cart = JSON.parse(localStorage.getItem("poundtechCart")) || [];
    } catch (e) {
        cart = [];
    }

    const existing = cart.find(function (item) { return item.product_id === product.id; });

    if (existing) {
        existing.quantity = Number(existing.quantity || 1) + quantity;
    } else {
        cart.push({
            product_id: product.id,
            supplier_id: product.supplier_id,
            name: product.name,
            price: PT.sale(product).now,
            quantity: quantity,
            image_url: product.image_url || ""
        });
    }

    localStorage.setItem("poundtechCart", JSON.stringify(cart));

    PT.toast(product.name + " added to cart");
}


// For logged-in customers: show which of their garage vehicles this fits.
async function showFitBadges(product) {

    const vehicles = await getVehicles();

    const box = document.getElementById("fit-badges");

    if (!box) { return; }

    const fits = vehicles.filter(function (v) { return PT.fit(product, v) === "match"; });

    box.innerHTML = fits.map(function (v) {
        return '<span class="fit-ok">Fits your ' + esc(v.year + " " + v.make + " " + v.model) + '</span>';
    }).join("");
}



/* ---------- REVIEWS ---------- */

let reviewList = [];
let reviewUser = null;
let reviewProduct = null;
let reviewsShown = 5;
let reviewRating = 0;

async function loadReviews(product) {

    reviewProduct = product;

    const { data: sessionData } = await supabaseClient.auth.getSession();
    reviewUser = sessionData && sessionData.session ? sessionData.session.user : null;

    const result = await supabaseClient
        .from("product_reviews")
        .select("id, user_id, reviewer_name, rating, title, body, verified_purchase, created_at, updated_at")
        .eq("product_id", product.id)
        .order("created_at", { ascending: false })
        .limit(200);

    // Reviews not set up yet: leave the section out rather than show an error.
    if (result.error) { console.error("REVIEWS:", result.error); return; }

    reviewList = result.data || [];

    renderReviews();
}


function reviewDate(iso) {
    return new Date(iso).toLocaleDateString("en-ZA", { day: "numeric", month: "long", year: "numeric" });
}


function renderReviews() {

    const section = document.getElementById("reviews");
    const body = document.getElementById("reviews-body");
    const count = reviewList.length;

    const avg = count ? reviewList.reduce(function (t, r) { return t + r.rating; }, 0) / count : 0;

    const line = document.getElementById("rating-line");

    if (line) {
        line.innerHTML = count
            ? PT.stars(avg) + '<a href="#reviews">' + avg.toFixed(1) + " (" + count + (count === 1 ? " review" : " reviews") + ")</a>"
            : '<a href="#reviews" style="margin-left:0;">Be the first to review</a>';
    }

    const mine = reviewUser ? reviewList.find(function (r) { return r.user_id === reviewUser.id; }) : null;

    let html = "";

    if (count) {

        const bars = [5, 4, 3, 2, 1].map(function (n) {
            const c = reviewList.filter(function (r) { return r.rating === n; }).length;
            return '<div class="rev-bar"><span>' + n + ' star</span><span class="track"><span class="fill" style="display:block;width:' +
                   Math.round(c / count * 100) + '%"></span></span><span class="n">' + c + '</span></div>';
        }).join("");

        html += '<div class="rev-summary">' +
                '<div class="rev-big"><b>' + esc(avg.toFixed(1)) + '</b>' + PT.stars(avg) + '<small>' + count + (count === 1 ? " review" : " reviews") + '</small></div>' +
                '<div class="rev-bars">' + bars + '</div></div>';

        html += reviewList.slice(0, reviewsShown).map(function (r) {
            return '<div class="review">' +
                '<div class="review-head">' + PT.stars(r.rating) + (r.title ? '<span class="review-title">' + esc(r.title) + '</span>' : "") + '</div>' +
                '<div class="review-meta">' + esc(r.reviewer_name) + " &middot; " + esc(reviewDate(r.created_at)) +
                (r.verified_purchase ? ' &middot; <span class="verified">Verified purchase</span>' : "") + '</div>' +
                (r.body ? '<p>' + esc(r.body) + '</p>' : "") +
                (reviewUser && r.user_id === reviewUser.id
                    ? '<div class="review-mine"><button type="button" id="edit-review">Edit</button><button type="button" id="delete-review">Delete</button></div>'
                    : "") +
                '</div>';
        }).join("");

        if (count > reviewsShown) {
            html += '<button type="button" class="more-reviews" id="more-reviews">Show more reviews</button>';
        }

    } else {
        html += '<p style="color:#666;margin-bottom:8px;">No reviews yet. Bought this? Tell other customers what you think.</p>';
    }

    html += reviewFormHtml(mine);

    body.innerHTML = html;
    section.hidden = false;

    reviewRating = mine ? mine.rating : 0;
    paintStarInput();
}


function reviewFormHtml(mine) {

    if (!reviewUser) {
        return '<div class="review-form"><p>Please <a href="customer-login.html" style="color:#e00000;font-weight:bold;">log in</a> to write a review.</p></div>';
    }

    let savedName = "";
    try { savedName = localStorage.getItem("ptReviewerName") || ""; } catch (e) { /* ignore */ }

    return '<div class="review-form" id="review-form">' +
        '<h3>' + (mine ? "Edit your review" : "Write a review") + '</h3>' +
        '<label>Your rating</label>' +
        '<div class="star-input" id="star-input" role="radiogroup" aria-label="Your rating">' +
        [1, 2, 3, 4, 5].map(function (n) {
            return '<button type="button" data-star="' + n + '" role="radio" aria-label="' + n + ' star' + (n > 1 ? "s" : "") + '">★</button>';
        }).join("") + '</div>' +
        '<label for="rv-name">Your name (shown with the review)</label>' +
        '<input type="text" id="rv-name" maxlength="40" value="' + esc(mine ? mine.reviewer_name : savedName) + '">' +
        '<label for="rv-title">Title (optional)</label>' +
        '<input type="text" id="rv-title" maxlength="80" value="' + esc(mine && mine.title ? mine.title : "") + '">' +
        '<label for="rv-body">Your review (optional)</label>' +
        '<textarea id="rv-body" maxlength="1500">' + esc(mine && mine.body ? mine.body : "") + '</textarea>' +
        '<button type="button" class="btn" id="submit-review">' + (mine ? "Update review" : "Submit review") + '</button>' +
        '<div id="review-message" role="status"></div>' +
        '</div>';
}


function paintStarInput() {

    document.querySelectorAll("#star-input button").forEach(function (b) {
        const on = Number(b.getAttribute("data-star")) <= reviewRating;
        b.classList.toggle("on", on);
        b.setAttribute("aria-checked", on && Number(b.getAttribute("data-star")) === reviewRating ? "true" : "false");
    });
}


function reviewMessage(text, kind) {
    const el = document.getElementById("review-message");
    if (el) { el.textContent = text; el.className = kind || ""; }
}


async function submitReview() {

    if (!reviewUser || !reviewProduct) { return; }

    if (!reviewRating) { reviewMessage("Please choose a star rating.", "error"); return; }

    const name = document.getElementById("rv-name").value.trim();

    if (!name) { reviewMessage("Please enter your name.", "error"); return; }

    const button = document.getElementById("submit-review");
    button.disabled = true;
    reviewMessage("Saving your review...", "");

    const { error } = await supabaseClient.rpc("submit_product_review", {
        p_product_id: reviewProduct.id,
        p_rating: reviewRating,
        p_title: document.getElementById("rv-title").value,
        p_body: document.getElementById("rv-body").value,
        p_name: name
    });

    button.disabled = false;

    if (error) {
        console.error(error);
        reviewMessage(error.message, "error");
        return;
    }

    try { localStorage.setItem("ptReviewerName", name); } catch (e) { /* ignore */ }

    await loadReviews(reviewProduct);

    reviewMessage("Thank you, your review has been saved.", "ok");
}


async function deleteMyReview() {

    const mine = reviewList.find(function (r) { return reviewUser && r.user_id === reviewUser.id; });

    if (!mine || !confirm("Delete your review?")) { return; }

    const { error } = await supabaseClient.from("product_reviews").delete().eq("id", mine.id);

    if (error) { console.error(error); alert("We couldn't delete your review. Please try again."); return; }

    await loadReviews(reviewProduct);
}


document.getElementById("reviews").addEventListener("click", function (e) {

    const star = e.target.closest("[data-star]");

    if (star) {
        reviewRating = Number(star.getAttribute("data-star"));
        paintStarInput();
        return;
    }

    if (e.target.closest("#submit-review")) { submitReview(); return; }

    if (e.target.closest("#delete-review")) { deleteMyReview(); return; }

    if (e.target.closest("#edit-review")) {
        const form = document.getElementById("review-form");
        if (form) { form.scrollIntoView({ behavior: "smooth", block: "center" }); }
        return;
    }

    if (e.target.closest("#more-reviews")) {
        reviewsShown += 10;
        renderReviews();
    }
});


let similarById = {};

// "More like this": same category first, then the same vehicle, then anything else in stock.
async function loadSimilar(product) {

    const LIMIT = 6;

    function inStock(p) { return Number(p.stock) > 0; }

    const [sameResult, otherResult, vehicles] = await Promise.all([
        supabaseClient.from("products").select("*")
            .eq("status", "Active").eq("category", product.category).neq("id", product.id).limit(24),
        supabaseClient.from("products").select("*")
            .eq("status", "Active").neq("id", product.id)
            .order("created_at", { ascending: false }).limit(24),
        getVehicles()
    ]);

    let list = !sameResult.error && sameResult.data ? sameResult.data.filter(inStock) : [];

    let usedOthers = false;

    if (list.length < LIMIT && !otherResult.error && otherResult.data) {
        const have = {};
        list.forEach(function (p) { have[p.id] = true; });
        otherResult.data.forEach(function (p) {
            if (!have[p.id] && inStock(p)) { list.push(p); usedOthers = true; }
        });
    }

    if (list.length === 0) { return; }

    function fitVehicle(p) {
        return vehicles.find(function (v) { return PT.fit(p, v) === "match"; }) || null;
    }

    function words(text) {
        return String(text || "").toLowerCase().split(/[^a-z0-9]+/)
            .filter(function (w) { return w.length > 2 && w !== "universal" && w !== "all"; });
    }

    const baseWords = words(product.vehicle_compatibility);

    function sharesVehicle(p) {
        return words(p.vehicle_compatibility).some(function (x) { return baseWords.indexOf(x) !== -1; });
    }

    const base = PT.sale(product).now;

    list = list
        .map(function (p) {
            return {
                p: p,
                v: fitVehicle(p),
                same: sharesVehicle(p),
                sameCat: p.category === product.category ? 0 : 1,
                gap: Math.abs(PT.sale(p).now - base)
            };
        })
        .sort(function (a, b) {
            if (a.sameCat !== b.sameCat) { return a.sameCat - b.sameCat; }
            if (!!a.v !== !!b.v) { return a.v ? -1 : 1; }
            if (a.same !== b.same) { return a.same ? -1 : 1; }
            return a.gap - b.gap;
        })
        .slice(0, LIMIT);

    PT.stash(list.map(function (row) { return row.p; }));

    similarById = {};
    list.forEach(function (row) { similarById[row.p.id] = row.p; });

    document.getElementById("more-sub").textContent = usedOthers
        ? "Other parts customers are looking at."
        : "More in " + product.category + ".";

    document.getElementById("more-grid").innerHTML = list.map(function (row) {

        const p = row.p;

        return `
            <div class="more-card" data-open="${esc(p.id)}">
                <div class="mc-image">
                    ${p.image_url ? PT.img(p.image_url, p.name) : "No image"}
                    ${PT.ribbons(p)}
                    ${PT.cardActions({ id: p.id, name: p.name, price: p.price, sale_price: p.sale_price, sale_ends_at: p.sale_ends_at })}
                </div>
                <div class="mc-info">
                    ${row.v ? '<div class="mc-fit">Fits your ' + esc(row.v.make + " " + row.v.model) + '</div>' : ""}
                    <h3>${esc(p.name)}</h3>
                    <span data-rating-for="${esc(p.id)}"></span>
                    ${PT.price(p)}
                    <button type="button" class="mc-add" data-add="${esc(p.id)}">Add to Cart</button>
                </div>
            </div>`;
    }).join("");

    document.getElementById("more-section").hidden = false;

    PT.refresh();

    PT.fetchRatings(list.map(function (row) { return row.p.id; })).then(PT.paintRatings);
}


document.getElementById("more-grid").addEventListener("click", function (e) {

    const add = e.target.closest("[data-add]");

    if (add) {
        const product = similarById[add.getAttribute("data-add")];
        if (product) { addProductToCart(product, 1); }
        return;
    }

    const card = e.target.closest("[data-open]");

    if (card && !e.target.closest("[data-pt-fav], [data-pt-share], .pt-actions")) {
        PT.open(card.getAttribute("data-open"));
    }
});


loadProduct();
